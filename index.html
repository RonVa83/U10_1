function spielstandTorschuetzeAuswahl(team, torIndex = null) {
  if (!S.spielstand || !Array.isArray(S.spielstand.tore)) return;

  const unsereMannschaft = S.spielstand.unsereMannschaft === 'heim' ? 'A' : 'B';
  const unserPlanTeam = 'A';
  if (team !== unsereMannschaft) return;

  let idx = torIndex;
  if (idx === null || idx === undefined) {
    const found = [...S.spielstand.tore].map((tor, i) => ({ tor, i })).reverse().find(item => item.tor.team === team && (!item.tor.spielerId || item.tor.spielerName === 'Auswahl offen'));
    idx = found ? found.i : null;
  }

  const list = matchSpielerListe().alle;
  if (!list.length) {
    toastZ('Keine Spieler für diese Mannschaft vorhanden.', 'err');
    return;
  }

  const gegnerKurz = gegnerCodeKurz();
  modal = { typ: 'torschuetze', team, torIndex: idx, sterne: {} };
  const title = team === unsereMannschaft ? 'Torschütze für ' + eigenKurz() + ' wählen' : 'Torschütze für ' + gegnerKurz + ' wählen';
  document.getElementById('modal-ti').textContent = title;
  document.getElementById('modal-body').innerHTML = `
    <div class="fg">
      <label>Spieler wählen</label>
      <div style="display:grid;gap:.5rem;margin-top:.5rem">
        ${spielerAuswahlHtml(matchSpielerListe(), id => "spielstandTorschuetzeSpeichern('" + team + "', '" + id + "')")}
      </div>
    </div>
    <div class="fg">
      <button class="btn btn-out" type="button" onclick="modalSch()">Abbrechen</button>
    </div>
  `;
  modalFooterSichtbar(false);
  document.getElementById('modal-ov').classList.remove('hidden');
}

function spielstandTorschuetzeSpeichern(team, spielerId) {
  if (!S.spielstand || !Array.isArray(S.spielstand.tore)) return;

  const idx = modal?.typ === 'torschuetze' && Number.isInteger(modal.torIndex)
    ? modal.torIndex
    : [...S.spielstand.tore].map((tor, i) => ({ tor, i })).reverse().find(item => item.tor.team === team && (!item.tor.spielerId || item.tor.spielerName === 'Auswahl offen'))?.i;

  const entry = idx !== undefined && idx !== null ? S.spielstand.tore[idx] : null;
  if (!entry) {
    toastZ('Kein offener Treffer für diese Auswahl gefunden.', 'err');
    modalSch();
    return;
  }

  const spieler = S.spieler.find(s => s.id === spielerId);
  if (!spieler) {
    toastZ('Bitte gültigen Torschütze wählen!', 'err');
    return;
  }

  const erstmals = !entry.spielerId;   // neues Tor → danach nach der Vorlage fragen
  entry.spielerId = spieler.id;
  entry.spielerName = spieler.name;
  modalSch();
  speichern();
  dbR();
  const gegnerKurz = gegnerCodeKurz();
  const teamLabel = team === (S.spielstand.unsereMannschaft === 'heim' ? 'A' : 'B') ? eigenKurz() : gegnerKurz;
  toastZ(`✅ Torschütze für ${teamLabel} gespeichert`, 'ok');
  if (erstmals) spielstandVorlageAuswahl(idx);
}

// Vorlagengeber zu einem Tor wählen (nicht der Torschütze selbst)
function spielstandVorlageAuswahl(index) {
  const tor = S.spielstand && Array.isArray(S.spielstand.tore) ? S.spielstand.tore[index] : null;
  if (!tor) return;
  const l = matchSpielerListe();
  const liste = { feld: l.feld.filter(x => x.id !== tor.spielerId), bank: l.bank.filter(x => x.id !== tor.spielerId) };
  modal = { typ: 'vorlage', torIndex: index, sterne: {} };
  document.getElementById('modal-ti').textContent = 'Vorlage von …?';
  document.getElementById('modal-body').innerHTML =
    '<div class="fg"><label>Wer hat aufgelegt? (Tor: ' + h(tor.spielerName || '') + ')</label>'
    + '<div style="display:grid;gap:.5rem;margin-top:.5rem">'
    + spielerAuswahlHtml(liste, id => "spielstandVorlageSpeichern(" + index + ", '" + id + "')")
    + '</div></div>'
    + '<div class="fg"><button class="btn btn-out btn-full" type="button" onclick="spielstandVorlageSpeichern(' + index + ', \'\')">Keine Vorlage</button></div>';
  modalFooterSichtbar(false);
  document.getElementById('modal-ov').classList.remove('hidden');
}

function spielstandVorlageSpeichern(index, id) {
  const tor = S.spielstand && Array.isArray(S.spielstand.tore) ? S.spielstand.tore[index] : null;
  if (!tor) { modalSch(); return; }
  const sp = id ? S.spieler.find(x => x.id === id) : null;
  if (sp) { tor.vorlageId = sp.id; tor.vorlageName = sp.name; }
  else { delete tor.vorlageId; delete tor.vorlageName; }
  modalSch();
  speichern();
  dbR();
  toastZ(sp ? '🅰️ Vorlage: ' + sp.name : 'Ohne Vorlage gespeichert', 'ok');
}

function spielstandTorLoeschen(index) {
  if (!S.spielstand || !Array.isArray(S.spielstand.tore) || index === null || index === undefined || index < 0 || index >= S.spielstand.tore.length) return;

  const tor = S.spielstand.tore[index];
  if (tor.team === 'A') S.spielstand.heim = Math.max(0, (S.spielstand.heim || 0) - 1);
  if (tor.team === 'B') S.spielstand.auswaerts = Math.max(0, (S.spielstand.auswaerts || 0) - 1);

  S.spielstand.tore.splice(index, 1);
  speichern();
  dbR();
  toastZ('✅ Tor gelöscht', 'ok');
}

function spielstandTorZeitAnpassen(index) {
  if (!S.spielstand || !Array.isArray(S.spielstand.tore) || index === null || index === undefined || index < 0 || index >= S.spielstand.tore.length) return;

  const tor = S.spielstand.tore[index];
  spielstandTorZeitModalOeffnen({
    titel: 'Torzeit anpassen',
    frageText: 'Wann wurde das Tor erzielt?',
    startViertel: tor.viertel,
    startZeitSek: tor.zeitSek,
    bestaetigenText: 'Übernehmen',
    speichern: torZeit => {
      tor.viertel = torZeit.viertel;
      tor.zeitSek = torZeit.zeitSek;
      tor.zeit = torZeit.zeit;
      speichern();
      dbR();
      toastZ('✅ Torzeit angepasst', 'ok');
    }
  });
}

function spielstandTorZeitWert(startViertel, minutenImViertel) {
  const viertelDauerMin = Math.max(1, Math.round((spielTimer.dauerSek || 15 * 60) / 60));
  const maxViertel = Math.max(1, Number(spielTimer.viertel || 4));
  const viertel = Math.min(maxViertel, Math.max(1, Number(startViertel || 1)));
  const minuten = Math.min(viertelDauerMin, Math.max(0, Number(minutenImViertel || 0)));
  const totalSeconds = (((viertel - 1) * viertelDauerMin) + minuten) * 60;

  return {
    viertel,
    zeitSek: totalSeconds,
    zeit: formatTimerSekunden(totalSeconds)
  };
}

function spielstandTorZeitModalOeffnen(optionen = {}) {
  const startViertel = Math.max(1, Number(optionen.startViertel || 1));
  const startZeitSek = Math.max(0, Number(optionen.startZeitSek || 0));
  const viertelDauerMin = Math.max(1, Math.round((spielTimer.dauerSek || 15 * 60) / 60));
  const maxViertel = Math.max(1, Number(spielTimer.viertel || 4));
  const minutenImViertel = Math.max(0, Math.round(startZeitSek / 60) - ((startViertel - 1) * viertelDauerMin));
  const titel = optionen.titel || 'Torzeit wählen';
  const frageText = optionen.frageText || 'Wann wurde das Tor erzielt?';
  const bestaetigenText = optionen.bestaetigenText || 'Speichern';

  modal = {
    typ: 'torzeit',
    startViertel,
    startZeitSek,
    speichern: optionen.speichern || null,
    sterne: {}
  };

  document.getElementById('modal-ti').textContent = titel;
  document.getElementById('modal-body').innerHTML = `
    <div class="fg">
      <label>${h(frageText)}</label>
      <p style="color:var(--mut);font-size:.85rem;margin-top:.35rem">Bitte Viertel und Minute auswählen.</p>
    </div>
    <div class="fg">
      <label>Viertel</label>
      <div class="timer-quarter-row" style="margin-top:.5rem">
        ${Array.from({length: maxViertel}, (_, i) => `<button class="timer-quarter-btn${startViertel === i + 1 ? ' active' : ''}" type="button" onclick="spielstandTorzeitViertelWaehlen(${i + 1})">V${i + 1}</button>`).join('')}
      </div>
      <select id="torzeit-viertel" style="display:none">
        ${Array.from({length: maxViertel}, (_, i) => `<option value="${i + 1}"${startViertel === i + 1 ? ' selected' : ''}>V${i + 1}</option>`).join('')}
      </select>
    </div>
    <div class="fg">
      <label for="torzeit-minute">Minute im Viertel</label>
      <input id="torzeit-minute" type="number" min="0" max="${viertelDauerMin}" value="${minutenImViertel}" inputmode="numeric" onkeydown="if(event.key==='Enter') spielstandTorZeitModalSpeichern()">
    </div>
    <div style="display:flex;gap:.75rem">
      <button class="btn btn-out" type="button" onclick="modalSch()">Abbrechen</button>
      <button class="btn btn-prim" type="button" onclick="spielstandTorZeitModalSpeichern()">${h(bestaetigenText)}</button>
    </div>
  `;
  modalFooterSichtbar(false);
  document.getElementById('modal-ov').classList.remove('hidden');
  setTimeout(() => document.getElementById('torzeit-minute')?.focus(), 100);
}

function spielstandTorzeitViertelWaehlen(viertel) {
  if (modal?.typ !== 'torzeit') return;

  const select = document.getElementById('torzeit-viertel');
  if (select) select.value = String(viertel);

  document.querySelectorAll('.timer-quarter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === `V${viertel}`);
  });
}

function spielstandTorZeitModalSpeichern() {
  if (modal?.typ !== 'torzeit' || typeof modal.speichern !== 'function') return;

  const viertelEl = document.getElementById('torzeit-viertel');
  const minutenEl = document.getElementById('torzeit-minute');
  const viertel = Math.max(1, Number(viertelEl?.value || 1));
  const minuten = Number(minutenEl?.value);

  if (!Number.isFinite(minuten)) {
    minutenEl?.classList.add('err');
    toastZ('Bitte eine gültige Minute eingeben!', 'err');
    return;
  }

  const torZeit = spielstandTorZeitWert(viertel, minuten);
  const speichernFn = modal.speichern;
  modalSch();
  torZeit && speichernFn(torZeit);
}

function spielstandTorEintragen(team, zeitInfo = null) {
  const unsereMannschaft = S.spielstand.unsereMannschaft === 'heim' ? 'A' : 'B';
  const isUnsereMannschaft = team === unsereMannschaft;
  const roundedMinute = Math.ceil(spielGesamtSekunden() / 60) * 60;
  const torZeit = zeitInfo || {
    viertel: spielTimer.aktuelle || 1,
    zeit: formatTimerSekunden(roundedMinute),
    zeitSek: roundedMinute
  };

  const entry = {
    team,
    spielerId: null,
    spielerName: isUnsereMannschaft ? 'Auswahl offen' : gegnerCodeKurz(),
    viertel: torZeit.viertel,
    zeit: torZeit.zeit,
    zeitSek: torZeit.zeitSek
  };

  S.spielstand.tore.push(entry);
  if (team === 'A') S.spielstand.heim += 1;
  else S.spielstand.auswaerts += 1;

  speichern();
  dbR();

  if (isUnsereMannschaft) {
    spielstandTorschuetzeAuswahl(team);
  }

  const gegnerKurz = gegnerCodeKurz();
  const teamLabel = team === unsereMannschaft ? eigenKurz() : gegnerKurz;
  toastZ(`✅ Tor für ${teamLabel} erfasst`, 'ok');
}

function spielstandToreBuchen(team) {
  if (!S.spielstand) S.spielstand = {heim:0, auswaerts:0, tore:[], unsereMannschaft:'heim'};

  if (spielTimer.running) {
    spielstandTorEintragen(team);
    return;
  }

  spielstandTorZeitModalOeffnen({
    titel: 'Torzeit erfassen',
    frageText: 'Wann wurde das Tor erzielt?',
    startViertel: spielTimer.aktuelle || 1,
    startZeitSek: Math.ceil(spielGesamtSekunden() / 60) * 60,
    bestaetigenText: 'Tor speichern',
    speichern: torZeit => spielstandTorEintragen(team, torZeit)
  });
}

function spielstandZuruecksetzen() {
  S.spielstand = {heim:0, auswaerts:0, tore:[], unsereMannschaft:'heim'};
  speichern();
  dbR();
}

function spielstandSeiteWechseln(neueSeite) {
  if (!S.spielstand) S.spielstand = {heim:0, auswaerts:0, tore:[], unsereMannschaft:'heim'};
  if (neueSeite !== 'heim' && neueSeite !== 'auswaerts') return;
  if (S.spielstand.unsereMannschaft === neueSeite) return;

  const alterHeimstand = S.spielstand.heim || 0;
  S.spielstand.heim = S.spielstand.auswaerts || 0;
  S.spielstand.auswaerts = alterHeimstand;
  S.spielstand.tore = (S.spielstand.tore || []).map(tor => Object.assign({}, tor, {
    team: tor.team === 'A' ? 'B' : tor.team === 'B' ? 'A' : tor.team
  }));
  S.spielstand.unsereMannschaft = neueSeite;
  speichern();
  dbR();
}

function spielstandModalOeffnen() {
  modal = { typ:'spielstand', id:null, sterne:{} };
  document.getElementById('modal-ti').textContent = 'Spielstand bearbeiten';
  document.getElementById('modal-body').innerHTML = spielstandHtml({ showEditor: true });
  modalFooterSichtbar(false);
  document.getElementById('modal-ov').classList.remove('hidden');
}

function spielstandModalAktualisieren() {
  if (modal?.typ !== 'spielstand') return;
  document.getElementById('modal-ti').textContent = 'Spielstand bearbeiten';
  document.getElementById('modal-body').innerHTML = spielstandHtml({ showEditor: true });
  modalFooterSichtbar(false);
}

function spielstandHtml(optionen = {}) {
  const showEditor = Boolean(optionen.showEditor);
  const embedded = Boolean(optionen.embedded);
  const includeTimer = Boolean(optionen.includeTimer);
  const stand = S.spielstand || {heim:0, auswaerts:0, tore:[], unsereMannschaft:'heim'};
  const unsereMannschaft = stand.unsereMannschaft === 'heim' ? 'A' : 'B';
  const gegnerKurz = gegnerCodeKurz();
  const teamName = (team) => team === unsereMannschaft ? eigenKurz() : gegnerKurz;
  const torButtonLabel = (team) => team === unsereMannschaft ? eigenKurz() : gegnerKurz;
  const heimButtonClass = 'score-btn score-btn-heim' + (stand.unsereMannschaft === 'heim' ? ' score-btn-our' : '');
  const awayButtonClass = 'score-btn score-btn-away' + (stand.unsereMannschaft === 'auswaerts' ? ' score-btn-our' : '');
  const leftTeamName = stand.unsereMannschaft === 'heim' ? eigenKurz() : gegnerKurz;
  const rightTeamName = stand.unsereMannschaft === 'heim' ? gegnerKurz : eigenKurz();
  const matchDate = new Date().toLocaleDateString('de-DE', { weekday: 'short', month: 'short', day: 'numeric' });
  const timerHeadline = `V${spielTimer.aktuelle}`;
  const timerGesamtZeit = formatTimerSekunden(spielGesamtSekunden());
  const timerStatusClass = spielTimer.remaining === 0 && spielTimer.aktuelle >= spielTimer.viertel
    ? 'stop'
    : (spielTimer.running ? 'run' : 'pause');
  const leftTeamShort = stand.unsereMannschaft === 'heim' ? eigenKurz() : gegnerKurz;
  const rightTeamShort = stand.unsereMannschaft === 'heim' ? gegnerKurz : eigenKurz();
  const leftTeamLogo = stand.unsereMannschaft === 'heim'
    ? eigenLogo()
    : teamLogoSrc(leftTeamShort, 'opp');
  const rightTeamLogo = stand.unsereMannschaft === 'auswaerts'
    ? eigenLogo()
    : teamLogoSrc(rightTeamShort, 'opp');
  const leftTeamClass = stand.unsereMannschaft === 'heim' ? 'our' : 'opp';
  const rightTeamClass = stand.unsereMannschaft === 'auswaerts' ? 'our' : 'opp';
  const codeRowClass = stand.unsereMannschaft === 'heim' ? 'score-code-row home' : 'score-code-row away';
  const sortierteTore = stand.tore
    .map((tor, index) => ({ tor, index }))
    .sort((a, b) => {
      const zeitA = Number.isFinite(Number(a.tor.zeitSek)) ? Number(a.tor.zeitSek) : Number.MAX_SAFE_INTEGER;
      const zeitB = Number.isFinite(Number(b.tor.zeitSek)) ? Number(b.tor.zeitSek) : Number.MAX_SAFE_INTEGER;
      return zeitA - zeitB || a.index - b.index;
    });
  const torZeitKurz = (tor) => {
    const minuten = tor.zeitSek !== undefined && tor.zeitSek !== null
      ? Math.max(0, Math.round(Number(tor.zeitSek || 0) / 60))
      : Math.max(0, parseInt(String(tor.zeit || '0').split(':')[0], 10) || 0);
    return minuten + "'";
  };
  const torAnzeigeName = (tor) => {
    if (tor.team !== unsereMannschaft) return gegnerKurz;
    if (tor.spielerId) return S.spieler.find(s => s.id === tor.spielerId)?.name || 'Unbekannt';
    return tor.spielerName || 'Auswahl offen';
  };
  const scorerLine = (tor) => {
    const name = torAnzeigeName(tor);
    return '<div class="score-scorer-line"><span class="score-scorer-name">' + h(name) + '</span><span class="score-scorer-time">' + h(torZeitKurz(tor)) + '</span></div>';
  };
  const scorersChronologisch = sortierteTore.length
    ? sortierteTore.map(({ tor }) => {
        const left = tor.team === 'A' ? scorerLine(tor) : '';
        const right = tor.team === 'B' ? scorerLine(tor) : '';
        return '<div class="score-scorers-col score-scorer-slot">' + left + '</div>'
          + '<div class="score-scorers-col right score-scorer-slot">' + right + '</div>';
      }).join('')
    : '';

  const toreRows = sortierteTore.length
    ? sortierteTore.map(({ tor, index }) => {
        const label = teamName(tor.team);
        const name = torAnzeigeName(tor);
        const isHome = tor.team === unsereMannschaft;
        const teamColor = isHome ? '#059669' : '#dc2626';
        const teamButtons = tor.team === unsereMannschaft
          ? '<div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.25rem">'
            + '<button class="btn btn-out btn-sm" title="Torschütze ändern" aria-label="Torschütze ändern" onclick="spielstandTorschuetzeAuswahl(\'' + tor.team + '\', ' + index + ')">⚽</button>'
            + '<button class="btn btn-out btn-sm" title="Vorlage" aria-label="Vorlage ändern" onclick="spielstandVorlageAuswahl(' + index + ')">🅰️</button>'
            + '<button class="btn btn-out btn-sm" title="Zeit ändern" aria-label="Zeit ändern" onclick="spielstandTorZeitAnpassen(' + index + ')">⏱</button>'
            + '<button class="btn btn-out btn-sm" title="Löschen" aria-label="Löschen" onclick="spielstandTorLoeschen(' + index + ')">🗑</button>'
            + '</div>'
          : '<div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.25rem">'
            + '<button class="btn btn-out btn-sm" title="Zeit ändern" aria-label="Zeit ändern" onclick="spielstandTorZeitAnpassen(' + index + ')">⏱</button>'
            + '<button class="btn btn-out btn-sm" title="Löschen" aria-label="Löschen" onclick="spielstandTorLoeschen(' + index + ')">🗑</button>'
            + '</div>';
        return '<li style="padding:.45rem .5rem;border-radius:10px;background:rgba(148,163,184,.06);border:1px solid rgba(148,163,184,.12)"><div style="display:flex;align-items:center;justify-content:space-between;gap:.5rem"><div style="display:flex;align-items:center;gap:.5rem;min-width:0"><span style="display:inline-flex;align-items:center;justify-content:center;width:1.5rem;height:1.5rem;border-radius:999px;background:' + teamColor + ';color:white;font-size:.7rem;font-weight:800;flex-shrink:0">' + (isHome ? 'E' : 'G') + '</span><div style="min-width:0"><div style="font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + h(name) + '</div><div style="font-size:.68rem;color:var(--mut)">' + label + ' · V' + tor.viertel + ' · ' + tor.zeit + (tor.vorlageName ? ' · 🅰️ ' + h(tor.vorlageName) : '') + '</div></div></div><span style="font-weight:800;color:' + teamColor + ';font-size:.8rem">' + label + '</span></div>' + teamButtons + '</li>';
      }).join('')
    : '<p style="color:var(--mut);font-size:.8125rem;margin:0">Noch keine Tore erfasst.</p>';

  const content = (showEditor
      ? '<div class="score-header">'
        + '<h3>⚽ Spielstand</h3>'
        + '<div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;justify-content:flex-end">'
        + '<div class="score-side-select">'
        + '<label>Wir spielen</label>'
        + '<select onchange="spielstandSeiteWechseln(this.value)">'
        + '<option value="heim"' + (stand.unsereMannschaft === 'heim' ? ' selected' : '') + '>Heim</option>'
        + '<option value="auswaerts"' + (stand.unsereMannschaft === 'auswaerts' ? ' selected' : '') + '>Auswärts</option>'
        + '</select>'
        + '</div>'
        + '</div>'
        + '</div>'
      : '')
    + '<div class="score-match">'
    + '<div class="score-match-head"><div class="score-match-top">' + h(ligaName()) + '</div><div class="score-match-date">' + h(matchDate) + '</div>'
    + (!showEditor ? '<button class="score-match-head-action" type="button" onclick="spielstandModalOeffnen()" aria-label="Einstellungen">⚙</button>' : '')
    + '</div>'
    + (includeTimer
      ? '<div class="score-timer-bar">'
        + '<div class="score-timer-main">'
        + '<div class="timer-display">'
        + '<div class="timer-display-stack">'
        + '<div class="timer-display-row">'
        + '<input class="timer-value timer-value-input" type="text" inputmode="numeric" value="' + formatTimerSekunden(spielTimer.remaining) + '" onblur="spielTimerZeitAnpassen(this.value); this.value = spielTimerZeitFormat(spielTimer.remaining);" onchange="spielTimerZeitAnpassen(this.value); this.value = spielTimerZeitFormat(spielTimer.remaining);" aria-label="Zeit anpassen"' + (spielTimer.running ? ' readonly' : '') + '>'
        + '<div class="timer-quarter-stack">'
        + '<div class="timer-current-quarter">' + timerHeadline + '</div>'
        + '<span class="score-timer-indicator ' + timerStatusClass + '" aria-hidden="true"></span>'
        + '</div>'
        + '</div>'
        + '<div class="score-timer-total"><strong>' + timerGesamtZeit + '</strong></div>'
        + '</div>'
        + '</div>'
        + '</div>'
        + '</div>'
      : '')
    + '<div class="score-match-row">'
    + '<div class="score-team left">'
    + '<div class="score-crest ' + leftTeamClass + '"><img src="' + leftTeamLogo + '" alt="' + h(leftTeamName) + '"></div>'
    + '</div>'
    + '<div class="score-score-wrap">'
    + '<div class="score-score"><span>' + stand.heim + '</span><span class="dash">-</span><span>' + stand.auswaerts + '</span></div>'
    + '</div>'
    + '<div class="score-team right">'
    + '<div class="score-crest ' + rightTeamClass + '"><img src="' + rightTeamLogo + '" alt="' + h(rightTeamName) + '"></div>'
    + '</div>'
    + '</div>'
    + (showEditor
      ? '<div class="' + codeRowClass + '">'
        + '<input type="text" maxlength="3" value="' + h(gegnerKurz) + '" style="width:54px;padding:.25rem .4rem;border:1.5px solid var(--brd);border-radius:6px;font-size:.75rem;background:var(--bg);color:var(--txt);text-transform:uppercase" oninput="aktualisiereGegnerCodeInput(this, false)" onchange="aktualisiereGegnerCodeInput(this, true)">'
        + '</div>'
      : '')
    + (!showEditor
      ? '<div class="score-scorers">'
        + scorersChronologisch
        + '</div>'
      : '')
    + '</div>'
    + '<div class="score-actions">'
    + '<button class="' + heimButtonClass + '" onclick="spielstandToreBuchen(\'A\')">Tor ' + torButtonLabel('A') + '</button>'
    + '<button class="' + awayButtonClass + '" onclick="spielstandToreBuchen(\'B\')">Tor ' + torButtonLabel('B') + '</button>'
    + '</div>'
    + (!showEditor ? '<div style="display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap;margin-top:.5rem"><a class="btn btn-out btn-sm" href="' + h(dfbnetUrl()) + '" target="_blank" rel="noopener">📤 Ergebnis melden</a><button class="btn btn-out btn-sm" type="button" onclick="dashboardSpielSpeichern()">+ Zum Dashboard</button></div>' : '')
    + (includeTimer ? spielTimerMarkup() : '')
    + (showEditor
      ? '<div style="display:flex;justify-content:flex-end;margin-bottom:.5rem">'
        + '<button class="btn btn-out btn-sm" onclick="spielstandZuruecksetzen()">Zurücksetzen</button>'
        + '</div>'
        + '<div>'
        + '<div style="font-size:.75rem;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.25rem">⚽ ⏱</div>'
        + '<ul class="score-list">' + toreRows + '</ul>'
        + '</div>'
      : '')
    + '';

  return embedded ? content : '<div class="score-card">' + content + '</div>';
}

let spielMode = 'planung';

function spielModeSet(m) {
  spielMode = m;
  spielplanungR();
}

function spielplanungR() {
  const el = document.getElementById('spielplanung-content');
  if (!el) return;
  el.innerHTML = planungSpielAuswahlHtml() + freigabeHtml()

    const viertel = (S.spielplanung && S.spielplanung.viertel) || 4;

    if (lineup && lineup.length) {
      team.forEach(s => cnt[s.id] = 0);

    }

    '<div class="tr-ber">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.375rem;gap:.5rem">'

    + '</div></div>'
    + (S.spieler.length

    + '<span class="ber-ti">⚽ Teams</span>'
    + ((S.spielplanung&&S.spielplanung.lineupA&&S.spielplanung.lineupA.length)
        ? '<div style="display:flex;gap:3px;flex-wrap:wrap">'
          + Array.from({length:S.spielplanung.viertel||4},(_,q)=>
              '<button class="team-btn'+(einsatzPrevQ===q?' ak':'')+'" onclick="setEinsatzPrevQ('+q+')">V'+(q+1)+'</button>'
            ).join('')

    + '<span class="ber-ti">📋 Einsatzplan</span></div>'

    + '<label style="font-size:.8125rem;color:var(--mut)">Viertel <input type="number" min="1" max="8" value="'

// Gibt eine saubere http(s)-Adresse zurück, '' bei leerem Feld, null bei ungültiger Eingabe
function urlNormalisieren(u) {
  u = String(u || '').trim();
  if (!u) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  return /^https?:\/\/[^\s]+$/i.test(u) ? u : null;
}

  const wert = id => document.getElementById(id)?.value || '';

  const gw = id => {
    const roh = wert(id).trim().replace(',', '.');

    const v = Number(roh);

  };
  const gewicht = { niveau: gw('e-g-niveau'), note: gw('e-g-note'), training: gw('e-g-training') };
  const falsch = Object.keys(gewicht).find(k => gewicht[k] === null);
  if (falsch) {
    document.getElementById('e-g-' + falsch)?.classList.add('err');
    toastZ('Gewichtung: bitte eine Zahl von 0 bis 10 eingeben.', 'err');

  }
  const eigene = [];
  for (const l of modal.eigene) {
    if (!String(l.url || '').trim() && !String(l.name || '').trim()) continue;   // leere Zeilen ignorieren

    if (!url) { toastZ('Ein weiterer Link hat keine gültige Adresse.', 'err'); return; }
    eigene.push({ name: String(l.name || '').trim(), url });
  }
  if (!S.einstellungen || typeof S.einstellungen !== 'object') S.einstellungen = {};

  const alterVerein = String(vereinName() || '').trim().toLowerCase();

  e.linkTabelle = tabelle;
  e.linkSpielplan = urlNormalisieren(wert('e-spielplan')) || '';

  e.nurVornamen = !!document.getElementById('e-vornamen')?.checked;
  e.teamBAktiv = !!document.getElementById('e-team-b')?.checked;
  if (!e.teamBAktiv && S.aufstellung) S.aufstellung.team = 'A';

  speichern();

  allesR();
  toastZ(vereinGeaendert ? '✅ Verein geändert – Spielplan gelöscht, bitte neu importieren' : '✅ Einstellungen gespeichert', 'ok');
  if (vereinGeaendert) setTimeout(spielplanImportOeffnen, 300);
}

/* ===== AUFSTELLUNG IM MATCH-REITER + SIGNALTON ===== */

let audioCtx = null;

function audioFreischalten() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = audioCtx || new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (_) {}
}

// Kurze Pieptöne: 2× am Viertelende, 3× am Spielende
function signalton(anzahl) {
  if (S.einstellungen && S.einstellungen.ton === false) return;
  try {
    audioFreischalten();
    if (!audioCtx) return;
    let t = audioCtx.currentTime;
    for (let i = 0; i < anzahl; i++) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      o.start(t); o.stop(t + 0.5);
      t += 0.65;
    }
  } catch (_) {}
}

function tonButtonR() {
  const b = document.getElementById('ton-btn');
  if (!b) return;
  const an = !(S.einstellungen && S.einstellungen.ton === false);
  b.textContent = an ? '🔔' : '🔕';
  b.setAttribute('aria-label', an ? 'Signalton an' : 'Signalton aus');
}

function tonUmschalten() {
  if (!S.einstellungen || typeof S.einstellungen !== 'object') S.einstellungen = {};
  S.einstellungen.ton = (S.einstellungen.ton === false);
  speichern();
  tonButtonR();
  if (S.einstellungen.ton) { audioFreischalten(); signalton(1); }
  toastZ(S.einstellungen.ton ? '🔔 Signalton an' : '🔕 Signalton aus', 'ok');
}

// Aufstellung für Team + Viertel: erst die selbst erstellte, sonst der automatische Einsatzplan
function matchAufstellungDaten(team, q, arbeit) {
  if (!arbeit && !planungPasstZumMatch()) return null;   // geöffnete Planung gehört zu einem anderen Spiel
  const A = S.aufstellung;
  const manuell = A && A.lineup && Array.isArray(A.lineup[team]) && Array.isArray(A.lineup[team][q]) ? A.lineup[team][q] : null;
  if (manuell && manuell.some(Boolean)) return { row: manuell.slice(0, 7), quelle: 'Aufstellung' };
  const src = team === 'A' ? S.spielplanung?.lineupA : S.spielplanung?.lineupB;
  if (src && Array.isArray(src[q]) && src[q].some(Boolean)) return { row: src[q].slice(0, 7), quelle: 'Einsatzplan' };
  return null;
}

/* ===== AUFSTELLUNG (selbst erstellen) ===== */

const FORMATIONEN = { '2-3-1':[2,3,1], '3-2-1':[3,2,1], '2-2-2':[2,1,1,2], '2-1-2-1':[2,1,2,1], '3-1-2':[3,1,2], '1-3-2':[1,3,2] }; // bei zwei Mittelfeld-Reihen (2-2-2, 2-1-2-1): unten defensiv (DM), oben offensiv (OM)

function aufKader(team) {
  const t = S.spieler.filter(x => x.spielteam === team);
  return t.length ? t : S.spieler.slice();
}

// Slot 0 = Torwart, Slot 1-6 = Feldspieler (Abwehr → Angriff)
function aufLineup(team, q) {
  const A = S.aufstellung;
  if (!Array.isArray(A.lineup[team])) A.lineup[team] = [];
  let l = A.lineup[team][q];
  if (!Array.isArray(l)) l = A.lineup[team][q] = [];
  while (l.length < 7) l.push(null);
  return l;
}

// Plätze mit Rolle (Position) und Seite; Slot 0 = Torwart
function aufSlots(formation) {
  const reihen = FORMATIONEN[formation] || FORMATIONEN['2-3-1'];
  const slots = [{ idx: 0, rolle: 'Torwart', seite: 'Mitte', kurz: 'TW' }];
  const mittelReihen = reihen.length - 2;   // Anzahl der Mittelfeld-Reihen
  const rolleVonReihe = reihen.map((_, ri) => {
    if (ri === 0) return 'Abwehr';
    if (ri === reihen.length - 1) return 'Sturm';
    if (mittelReihen >= 2) return ri === 1 ? 'Defensives Mittelfeld' : ri === reihen.length - 2 ? 'Offensives Mittelfeld' : 'Mittelfeld';
    return 'Mittelfeld';
  });
  let idx = 1;
  reihen.forEach((anzahl, ri) => {
    const rolle = rolleVonReihe[ri];
    const seiten = anzahl === 1 ? ['Mitte'] : anzahl === 2 ? ['Links', 'Rechts'] : ['Links', 'Mitte', 'Rechts'];
    for (let i = 0; i < anzahl; i++) slots.push({ idx: idx++, rolle, seite: seiten[i], reihe: ri });
  });
  // Kurzbezeichnung, z. B. "AB L", "MF M", "ST" (bei zwei Mittelfeld-Reihen: hinten/vorne)
  slots.forEach(sl => {
    if (sl.rolle === 'Torwart') return;
    const anzahl = slots.filter(x => x.reihe === sl.reihe).length;
    const reihenDerRolle = rolleVonReihe.map((r, ri) => r === sl.rolle ? ri : -1).filter(x => x >= 0);
    let k = POS_SHORT[sl.rolle];
    if (anzahl > 1) k += ' ' + sl.seite.charAt(0);
    if (reihenDerRolle.length > 1) k += reihenDerRolle.indexOf(sl.reihe) === 0 ? ' hi' : ' vo';
    sl.kurz = k;
  });
  return slots;
}

const POS_ORDER = { Abwehr: 0, 'Defensives Mittelfeld': 1, Mittelfeld: 1.5, 'Offensives Mittelfeld': 2, Sturm: 3 };
const punkteFuerAbstand = d => d === 0 ? 10 : d <= 0.5 ? 8 : d <= 1 ? 4 : d <= 1.5 ? 2 : 0;

// Wie gut passt ein Spieler auf einen Platz? (1. und 2. Position + starker Fuß)
function aufPassung(sp, slot) {
  let score = (sp.niveau || 0) * 0.3;
  let posOk = true, fussOk = true;
  const positionen = [sp.position, sp.position2].filter(Boolean);
  if (slot.rolle === 'Torwart') {
    const i = positionen.indexOf('Torwart');
    if (i === 0) score += 12;
    else if (i === 1) score += 9;
    else { score -= 20; posOk = false; }
  } else {
    const feld = positionen.map((p, i) => ({ p, i })).filter(x => x.p !== 'Torwart');
    if (!feld.length) {
      score -= 15; posOk = false;
    } else {
      let bestPunkte = -99, bestD = 9;
      feld.forEach(({ p, i }) => {
        const d = Math.abs((POS_ORDER[p] ?? 1) - POS_ORDER[slot.rolle]);
        const punkte = punkteFuerAbstand(d) - (i ? (d === 0 ? 3 : 1) : 0); // 2. Position etwas weniger wert
        if (punkte > bestPunkte) { bestPunkte = punkte; bestD = d; }
      });
      score += bestPunkte;
      if (bestD > 0.5) posOk = false;   // „Mittelfeld“ allgemein passt auf defensiv und offensiv
    }
    const f = sp.starkerFuss;
    if (f === 'Beidfüßig') score += 2;
    else if (slot.seite === 'Mitte') score += 1;
    else if (slot.seite === f) score += 4;          // Links-Fuß links, Rechts-Fuß rechts
    else { score -= 3; fussOk = false; }
  }
  return { score, posOk, fussOk };
}

function aufInfo(sp, slot) {
  const pa = slot ? aufPassung(sp, slot) : null;
  const istTw = slot && slot.rolle === 'Torwart';
  const pos = [sp.position, sp.position2].filter(Boolean).map(p => POS_SHORT[p] || '?').join('/');
  const text = pos + (istTw ? '' : ' · ' + (FUSS_SHORT[sp.starkerFuss] || '?'));
  return { text, warn: pa ? (!pa.posOk || !pa.fussOk) : false };
}

    + '</select></label>'

// ===== CO-TRAINER: eine aktuelle Team-A-Liste, die bei jedem Senden ersetzt wird =====
// Namen für den Chatbot: standardmäßig nur Vornamen (bei doppelten Vornamen mit Initial)
function coTrainerNamen() {
  const map = {};
  if (einst().nurVornamen === false) { S.spieler.forEach(sp => { map[sp.id] = String(sp.name || '').trim(); }); return map; }
  const teile = sp => String(sp.name || '').trim().split(/\s+/);
  const zaehler = {};
  S.spieler.forEach(sp => { const v = teile(sp)[0].toLowerCase(); zaehler[v] = (zaehler[v] || 0) + 1; });
  S.spieler.forEach(sp => {
    const t = teile(sp);
    map[sp.id] = t[0] + (zaehler[t[0].toLowerCase()] > 1 && t[1] ? ' ' + t[1].charAt(0) + '.' : '');
  });
  return map;
}

function coTrainerTeamASpieler() {
  const ids = new Set();
  const viertel = Math.max(1, Math.min(8, Number(S.spielplanung && S.spielplanung.viertel) || 4));
  for (let q = 0; q < viertel; q++) {
    // Nutzt dieselbe Priorität wie die Match-Anzeige: manuelle Team-A-Aufstellung, sonst Einsatzplan.
    const daten = matchAufstellungDaten('A', q, true);
    if (daten && Array.isArray(daten.row)) daten.row.filter(Boolean).forEach(id => ids.add(String(id)));
  }
  // Nur IDs auflösen, die tatsächlich zu einem Spieler in der EbeApp gehören.
  const gesehen = new Set();
  const namen = coTrainerNamen();
  return S.spieler
    .filter(sp => ids.has(String(sp.id)) && !gesehen.has(String(sp.id)) && (gesehen.add(String(sp.id)), true))
    .map(sp => namen[sp.id])
    .filter(Boolean);
}

function planGegnerName(g) {
  return String(g.unsereSeite === 'heim' ? g.auswaerts : g.heim || '').replace(/\s+U\d+.*$/i, '').trim();
}

// Gesamter Spielplan für den Bot, mit Ergebnissen der gespielten Spiele (aus Sicht der eigenen Mannschaft)
function coTrainerSpielplan() {
  const namen = coTrainerNamen();
  const nurVor = einst().nurVornamen !== false;
  const name = (id, n) => {
    if (id && namen[id]) return namen[id];
    const t = String(n || '').trim();
    return nurVor ? t.split(/\s+/)[0] : t;
  };
  return planNachDatum(spielplanListe()).map(g => {
    const e = planEintrag(g.id);
    let erg = null;
    if (e) {
      const heimEigen = e.unsereSeite === 'heim';
      erg = { wir: Number(heimEigen ? e.heim : e.auswaerts) || 0, gegner: Number(heimEigen ? e.auswaerts : e.heim) || 0 };
    } else if (g.ergebnis) {
      erg = g.unsereSeite === 'heim' ? { wir: g.ergebnis.heim, gegner: g.ergebnis.auswaerts } : { wir: g.ergebnis.auswaerts, gegner: g.ergebnis.heim };
    }
    // Eigene Torschützen (nur bei gespeicherten Matches), in zeitlicher Reihenfolge
    const tore = e && Array.isArray(e.tore) ? e.tore.slice().sort((a, b) => (Number(a.zeitSek) || 0) - (Number(b.zeitSek) || 0))
      .map(t => ({
        spieler: name(t.spielerId, t.name) || 'unbekannt',
        minute: Number.isFinite(Number(t.zeitSek)) && t.zeitSek !== null ? Math.max(0, Math.round(Number(t.zeitSek) / 60)) : null,
        vorlage: t.vorlageId || t.vorlageName ? name(t.vorlageId, t.vorlageName) : ''
      })) : [];
    return { datum: g.datum, zeit: g.zeit || '', heimAuswaerts: g.unsereSeite === 'heim' ? 'Heim' : 'Auswärts', gegner: planGegnerName(g), ort: g.ort || '', gespielt: !!erg, ergebnis: erg, tore };
  });
}

// Ligatabelle für den Bot (Platz, Punkte, Tore usw.)
function coTrainerTabelle() {
  const T = S.tabelle || { zeilen: [], stand: '' };
  const verein = String(vereinName() || '').trim().toLowerCase();
  return {
    stand: T.stand || '',
    teams: (T.zeilen || []).map((z, i) => ({
      platz: i + 1, mannschaft: String(z.name || '').replace(/\s+U\d+\b/i, '').trim(),
      spiele: z.sp, siege: z.g, unentschieden: z.u, niederlagen: z.v,
      toreFuer: z.tp, toreGegen: z.tg, differenz: z.tp - z.tg, punkte: z.g * 3 + z.u,
      eigene: !!verein && String(z.name || '').toLowerCase().includes(verein)
    }))
  };
}

// Daten für den Bot: Spieler, Freigabe-Status, das zugehörige Spiel, der ganze Spielplan und die Tabelle
function coTrainerPayload() {
  const g = S.planungSpielId ? planSpiel(S.planungSpielId) : null;

// Letzte erfolgreich gesendete Liste: gleiche Liste wird automatisch nicht nochmal gesendet (schont das Limit im Worker)
let coTrainerZuletzt = (() => { try { return localStorage.getItem('ebe_cotrainer_zuletzt'); } catch (_) { return null; } })();

async function coTrainerCloudflareSync(manual = false) {
  const payload = coTrainerPayload();
  const spieler = payload.players;
  const schluessel = JSON.stringify(payload);
  if (!manual) {
    if (navigator.onLine === false) return false;
    if (schluessel === coTrainerZuletzt) {
      coTrainerStatus('✅ Team A ist bereits aktuell (' + spieler.length + ' Spieler).');
      return true;
    }
  }
  const statusText = manual
    ? (spieler.length ? 'Sende ' + spieler.length + ' Spieler …' : 'Sende leere Team-A-Liste, um die alte Liste zu löschen …')
    : 'Synchronisiere Team A …';
  if (manual) coTrainerStatus(statusText);
  try {
    const response = await fetch(CO_TRAINER_LINEUP_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      cache: 'no-store'
    });
    if (!response.ok) {
      let detail = '';
      try { detail = (await response.json()).error || ''; } catch (_) {}
      throw new Error('HTTP ' + response.status + (detail ? ' – ' + detail : ''));
    }
    coTrainerZuletzt = schluessel;
    try { localStorage.setItem('ebe_cotrainer_zuletzt', schluessel); } catch (_) {}
    if (manual) {
      coTrainerStatus('✅ ' + spieler.length + ' Spieler übertragen (' + (payload.released ? 'freigegeben' : 'noch nicht freigegeben') + ', ' + payload.schedule.length + ' Spiele im Spielplan). Die bisherige Liste wurde ersetzt.');
      toastZ('✅ Team-A-Liste an Co-Trainer gesendet', 'ok');
    } else {
      coTrainerStatus('✅ Team A automatisch synchronisiert (' + spieler.length + ' Spieler).');
    }
    return true;
  } catch (err) {
    console.warn('Team-A-Sync fehlgeschlagen:', err);
    coTrainerStatus('Synchronisierung fehlgeschlagen. Prüfe, ob der Cloudflare-Worker mit Variante A veröffentlicht ist. ' + (err && err.message ? err.message : ''), true);
    if (manual) toastZ('Co-Trainer konnte nicht erreicht werden.', 'err');
    return false;
  }
}

// Automatischer Vorschlag für das gewählte Viertel: Position + starker Fuß, Spieler mit weniger Einsätzen bevorzugt
function aufstellungVorschlag() {
  const A = S.aufstellung;
  const team = A.team, q = A.q;
  const kader = aufKader(team);
  if (!kader.length) { toastZ('Keine Spieler vorhanden.', 'err'); return; }

  const los = () => {
    const slots = aufSlots(A.formation);
    const einsaetze = {};
    kader.forEach(x => { einsaetze[x.id] = 0; });
    (A.lineup[team] || []).forEach((row, qi) => {
      if (qi === q || !Array.isArray(row)) return;
      row.forEach(id => { if (id && einsaetze[id] !== undefined) einsaetze[id]++; });
    });
    const frei = new Set(slots.map(sl => sl.idx));
    const avail = new Set(kader.map(x => x.id));
    const neu = Array(7).fill(null);
    while (frei.size && avail.size) {
      let best = null;
      frei.forEach(i => avail.forEach(id => {
        const sp = kader.find(x => x.id === id);
        const sc = aufPassung(sp, slots[i]).score - 1.5 * einsaetze[id];
        if (!best || sc > best.sc) best = { i, id, sc };
      }));
      neu[best.i] = best.id;
      frei.delete(best.i);
      avail.delete(best.id);
    }
    if (!Array.isArray(A.lineup[team])) A.lineup[team] = [];
    A.lineup[team][q] = neu;
    speichern();
    aufstellungR();
    if (team === 'A') coTrainerTeamAAutoSync();
    toastZ('✅ Vorschlag erstellt', 'ok');
  };

  if (aufLineup(team, q).some(Boolean)) {
    bestaetigen('Vorschlag', 'Die Aufstellung von Team ' + team + ', V' + (q + 1) + ' wird durch einen Vorschlag ersetzt.', 'Vorschlag', los);
  } else {
    los();
  }
}

function spAutoBerechnen(spielerListe, gk1Id, gk2Id, v1fest) {
  const viertel = (S.spielplanung && S.spielplanung.viertel) || 4;
  // Importiertes V1 (7 Plätze: TW + 6 Feld); nur Spieler dieses Teams zählen
  let fest = Array.isArray(v1fest)
    ? v1fest.slice(0, 7).map(id => (id && spielerListe.some(p => p.id === id)) ? id : null)
    : null;
  if (fest) { while (fest.length < 7) fest.push(null); if (!fest.some(Boolean)) fest = null; }
  let gks    = spielerListe.filter(p => p.position === 'Torwart');
  if (!gks.length) gks = spielerListe.filter(p => p.position2 === 'Torwart'); // Ersatz: Spieler mit 2. Position Torwart
  gks.sort((a,b)=>(b.niveau||0)-(a.niveau||0));

  // TW1 / TW2: manuell gewählt (hat Vorrang) oder automatisch nach Niveau; TW2 = "-" bedeutet bewusst keiner
  const finde = id => (id && id !== '-') ? (spielerListe.find(p => p.id === id) || null) : null;
  const g1man = (fest && fest[0]) ? finde(fest[0]) : finde(gk1Id), g2man = finde(gk2Id);   // der Torwart aus dem importierten V1 ist TW1
  const rest  = gks.filter(g => g !== g1man && g !== g2man);
  let gk1 = g1man || rest.shift() || null;
  let gk2 = gk2Id === '-' ? null : (g2man || rest.shift() || null);
  if (!gk1 && gk2) { gk1 = gk2; gk2 = null; }
  if (gk1 && gk2 && gk1.id === gk2.id) gk2 = null;

  // TW1 steht in V1, V2 und V4 im Tor, TW2 in V3. TW2 spielt in V1 im Feld.
  let gkV;
  if (!gk1) gkV = Array(viertel).fill(null);
  else if (gk2 && viertel === 4) gkV = [gk1.id, gk1.id, gk2.id, gk1.id];
  else if (gk2) gkV = Array.from({length:viertel}, (_,q) => q < Math.ceil(viertel * 3 / 4) ? gk1.id : gk2.id);
  else gkV = Array(viertel).fill(gk1.id);
  if (fest) gkV[0] = fest[0] || null;
  const feldPflichtV1 = (gk2 && !fest) ? gk2.id : null;
const plays = {};
const benches = {};

spielerListe.forEach(p => {
  plays[p.id] = 0;
  benches[p.id] = 0;
});
  // Tor-Einsaetze vorab einrechnen, damit der Cap auch fuer TWs greift
  gkV.forEach(id => { if (id !== null && plays[id] !== undefined) plays[id]++; });
const fieldV = [];

for (let q = 0; q < viertel; q++) {

  const gkThisQ = gkV[q];

  // V1 steht fest (importiert): nur die Zähler fortschreiben, die restlichen Viertel werden danach berechnet
  if (q === 0 && fest) {
    const imFeld = new Set(fest.slice(1).filter(Boolean));
    spielerListe.forEach(p => { if (imFeld.has(p.id)) plays[p.id]++; else if (p.id !== gkThisQ) benches[p.id]++; });
    fieldV.push(fest.slice(1));
    continue;
  }

  const feldspieler = spielerListe.filter(p => p.id !== gkThisQ);

  const freiePlaetze = Math.min(6, feldspieler.length);
  const anzahlPausen = Math.max(
  0,
  feldspieler.length - freiePlaetze
);

const sortiert = [...feldspieler]
  .map((p, index) => ({ p, index }))
  .sort((a, b) => {

    const pa = a.p;
    const pb = b.p;

    // TW2 muss in V1 im Feld spielen: er wird nie zum Pausieren eingeteilt
    if (q === 0 && feldPflichtV1) {
      if (pa.id === feldPflichtV1) return 1;
      if (pb.id === feldPflichtV1) return -1;
    }

    if (benches[pa.id] !== benches[pb.id]) {
      return benches[pa.id] - benches[pb.id];
    }

    if ((pa.niveau || 0) !== (pb.niveau || 0)) {
      return (pa.niveau || 0) - (pb.niveau || 0);
    }

    if (plays[pa.id] !== plays[pb.id]) {
      return plays[pb.id] - plays[pa.id];
    }

    // Bei komplettem Gleichstand:
    // Spieler, die weiter oben in der Liste stehen,
    // werden bevorzugt
   return S.spieler.findIndex(s => s.id === a.p.id)
     - S.spieler.findIndex(s => s.id === b.p.id);

  })
  .map(x => x.p);
  
const pausierende = sortiert.slice(0, anzahlPausen);
const spielende   = sortiert.slice(anzahlPausen);

  spielende.forEach(p => {
    plays[p.id]++;
  });

  pausierende.forEach(p => {
    benches[p.id]++;
  });

  fieldV.push(einsatzFeldZuweisen(spielende));
}
  return Array.from({length:viertel}, (_,q) => [gkV[q], ...fieldV[q]]);
}

// Verteilt die spielenden Feldspieler optimal auf die Plätze der Formation (Position + starker Fuß)
function einsatzFeldZuweisen(spieler) {
  const slots = aufSlots((S.aufstellung && S.aufstellung.formation) || '2-3-1').filter(sl => sl.idx > 0);
  const items = spieler.slice();
  while (items.length < slots.length) items.push(null);   // leere Plätze
  const belegt = new Array(items.length).fill(false);
  const aktuell = new Array(slots.length).fill(null);
  let best = { score: -Infinity, arr: aktuell.slice() };
  const suche = (si, score) => {
    if (si === slots.length) {
      if (score > best.score) best = { score, arr: aktuell.slice() };
      return;
    }
    for (let i = 0; i < items.length; i++) {
      if (belegt[i]) continue;
      belegt[i] = true;
      aktuell[si] = items[i] ? items[i].id : null;
      suche(si + 1, score + (items[i] ? aufPassung(items[i], slots[si]).score : 0));
      belegt[i] = false;
      aktuell[si] = null;
    }
  };
  suche(0, 0);
  return best.arr;
}

function naechsterMittwochOderFreitag(date = new Date()) {
  const start = new Date(date);
  start.setHours(0, 0, 0, 0);

  const ziele = [3, 5]; // Mittwoch, Freitag
  let besterTag = new Date(start);
  let kleinsterAbstand = Number.MAX_SAFE_INTEGER;

  ziele.forEach(tag => {
    let abstand = (tag - start.getDay() + 7) % 7;
    if (abstand === 0) abstand = 7;

    const kandidat = new Date(start);
    kandidat.setDate(start.getDate() + abstand);

    if (abstand < kleinsterAbstand) {
      kleinsterAbstand = abstand;
      besterTag = kandidat;
    }
  });

  return besterTag;
}

function waText() {
  if (!aktiverPlan) return '';
  const p = aktiverPlan;
  const teamZeilen = p.teams
    .filter(t => t.spieler.length)
    .flatMap((t, i) => [`${t.label}: ${t.spieler.map(s=>s.name).join(', ')}`, ...(i < p.teams.filter(tt => tt.spieler.length).length - 1 ? [''] : [])]);
  const terminDatum = p.naechsterTermin instanceof Date ? p.naechsterTermin : new Date();
  const tag = ['So','Mo','Di','Mi','Do','Fr','Sa'][terminDatum.getDay()];
  const termin = `${tag}. ${String(terminDatum.getDate()).padStart(2,'0')}.${String(terminDatum.getMonth() + 1).padStart(2,'0')}.`;

  return [
    `⚽ Training: ${termin}`,'',
    `👥 Spieler: ${p.spieler}`,'',
    ...teamZeilen,'',
    '🧑‍🏫 Trainer:', ...p.trainer.map(t => `• ${t.name}`),'',
    '📋 Ablauf:',
    `1️⃣ Aktivierung – 15 min`,
    `2️⃣ Hauptteil – 45 min`,
    ...p.hauptteil.map(x => `   🎯 ${x.s} (${Math.floor(45/p.hauptteil.length)} min) → ${x.tr ? x.tr.name : 'kein Trainer'}`),
    `3️⃣ Abschlussspiel – 2 × 15 min`
  ].join('\n');
}

function waKopieren() {
  const t = waText();
  if (!t) { toastZ('Kein Plan vorhanden!','err'); return; }
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(t)
      .then(() => toastZ('📋 Text kopiert!','ok'))
      .catch(() => waFallback(t));
  } else { waFallback(t); }
}

function waFallback(text) {
  const ta = document.createElement('textarea');
  Object.assign(ta.style, {position:'fixed',opacity:'0',top:'0',left:'0'});
  ta.value = text;
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); toastZ('📋 Text kopiert!','ok'); }
  catch(_) { toastZ('Kopieren fehlgeschlagen.','err'); }
  document.body.removeChild(ta);
}

function waOeffnen() {
  const t = waText();
  if (!t) { toastZ('Kein Plan vorhanden!','err'); return; }
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank', 'noopener');
}

/* ===== GEGNER-ANALYSER ===== */

function gegnerAnalyse(G) {
  const spieler = G.spieler || [];
  // TW-Spieler (in mind. einem Viertel als TW markiert) sind von den Rotationsregeln ausgenommen
  const twPlayers = new Set((G.twPerQ || []).filter(Boolean));
  const field   = spieler.filter(s => !twPlayers.has(s));
  const viertel = G.viertel || 4;
  const lineup  = G.lineup  || [];

  const benchCount = {}, spielCount = {};
  spieler.forEach(s => { benchCount[s] = 0; spielCount[s] = 0; });

  const violations = [];
  const hasBenched = new Set();

  // Nur Viertel mit eingetragenem Lineup berücksichtigen
  const activeQ = Array.from({length: viertel}, (_, q) => q)
    .filter(q => lineup[q] && lineup[q].length > 0);

  for (let qi = 0; qi < activeQ.length; qi++) {
    const q = activeQ[qi];
    const playing = new Set(lineup[q] || []);
    spieler.forEach(s => { if (playing.has(s)) spielCount[s]++; else benchCount[s]++; });

    // Rotation erforderlich? Mehr Spieler als Plätze in diesem Viertel
    const rotRequired = spieler.length > playing.size;

    if (rotRequired) {
      // Regel: 2. Pause erst wenn alle Feldspieler mindestens 1× pausiert haben
      const benchedThisQ = new Set(field.filter(s => !playing.has(s)));
      benchedThisQ.forEach(s => {
        if (hasBenched.has(s)) {
          // Spieler die im SELBEN Viertel erstmals raus sind, zählen als "bereits pausiert"
          const notYet = field.filter(p => p !== s && !hasBenched.has(p) && !benchedThisQ.has(p));
          if (notYet.length)
            violations.push({ type:'doppelPause', quarter:q+1, spieler:s, notYet });
        }
      });
    }
    field.filter(s => !playing.has(s)).forEach(s => hasBenched.add(s));
  }

  // Regel: Durchspielen – nur wenn Rotation überhaupt möglich war
  const anyBench = field.some(s => benchCount[s] > 0);
  if (anyBench && activeQ.length > 0) {
    field.forEach(s => {
      const played = activeQ.filter(q => (lineup[q]||[]).includes(s)).length;
      if (played === activeQ.length)
        violations.push({ type:'durchspielen', spieler:s });
    });
  }

  return { benchCount, spielCount, violations };
}

function gegnerR() {
  const el = document.getElementById('gegner-content');
  if (!el) return;
  const G = S.gegner || { viertel:4, spieler:[], lineup:[], twPerQ:[] };
  while (G.lineup.length < G.viertel) G.lineup.push([]);
  G.lineup.length = G.viertel;

  const { benchCount, spielCount, violations } = gegnerAnalyse(G);
  const hasData = G.spieler.length && G.lineup.some(q => q && q.length > 0);
  const codeValue = String(G.code || 'GEG').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3) || 'GEG';

  // Spieler-Chips mit × löschen
  const spChips = G.spieler.map(nr => {
    return '<span style="display:inline-flex;align-items:center;gap:2px;background:var(--surf);border:1.5px solid var(--brd);'
      + 'border-radius:999px;padding:2px 8px 2px 10px;font-size:.75rem;font-weight:700">'
      + h(nr)
      + '<button onclick="gegnerSpielerDel(\'' + h(nr) + '\')" style="background:none;border:none;cursor:pointer;color:var(--mut);padding:0 0 0 2px;font-size:.875rem;line-height:1" aria-label="Entfernen">×</button>'
      + '</span>';
  }).join('');

  let html =
    '<div class="tr-ber">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.375rem;gap:.5rem">'
    + '<span class="ber-ti">👥 Spieler</span>'
    + '<span style="font-size:.75rem;color:var(--mut)">' + G.spieler.length + ' Spieler</span>'
    + '</div>'
    + '<div style="display:flex;gap:.375rem;margin-bottom:.5rem">'
    + '<input id="geg-nr-input" type="text" inputmode="numeric" maxlength="3" placeholder="Nr."'
    + ' style="flex:1;max-width:72px;padding:.25rem .5rem;border:1.5px solid var(--brd);border-radius:6px;font-size:.875rem;background:var(--bg);color:var(--txt)"'
    + ' onkeydown="if(event.key===\'Enter\')gegnerSpielerAdd()">'
    + '<button class="btn btn-prim btn-sm" onclick="gegnerSpielerAdd()">＋ Hinzufügen</button>'
    + (G.spieler.length ? '<button class="btn btn-out btn-sm" onclick="gegnerReset()" style="color:var(--err);border-color:var(--err)">🗑 Reset</button>' : '')
    + '</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:.375rem">'
    + (spChips || '<span style="color:var(--mut);font-size:.8125rem">Noch keine Spieler.</span>')
    + '</div></div>';

  // Gegner-Code und Einstellungen
  html +=
    '<div class="tr-ber">'
    + '<span class="ber-ti" style="display:block;margin-bottom:.375rem">🏟️ Gegner</span>'
    + '<label style="font-size:.8125rem;color:var(--mut)">Viertel '
    + '<input type="number" min="2" max="8" value="' + G.viertel + '"'
    + ' style="width:40px;padding:.125rem .25rem;border:1.5px solid var(--brd);border-radius:4px;font-size:.875rem;background:var(--bg);color:var(--txt)"'
    + ' onchange="gegnerViertelSet(Math.max(2,Math.min(8,+this.value)))">'
    + '</label></div>';

  // Lineup pro Viertel – 3 Zustände: Bank(ab) → Feld(an) → TW(tw) → Bank
  if (G.spieler.length) {
    const twPerQ = G.twPerQ || [];
    html += '<div class="tr-ber"><span class="ber-ti" style="display:block;margin-bottom:.25rem">📋 Lineup pro Viertel</span>'
      + '<div style="font-size:.7rem;color:var(--mut);margin-bottom:.375rem">Tippen: Bank ↔ Feld · Knopf 🧤 antippen, dann Spieler = Torwart</div>'
      + '<div style="display:flex;flex-direction:column;gap:.625rem">';
    for (let q = 0; q < G.viertel; q++) {
      const playing = new Set(G.lineup[q] || []);
      const twNr = twPerQ[q] || null;
      const twAktiv = gegnerTwModus === q;
      html += '<div><div style="display:flex;align-items:center;gap:.5rem;font-size:.75rem;font-weight:700;color:var(--mut);margin-bottom:.25rem">V' + (q+1)
        + ' <span style="font-weight:400">(' + playing.size + ' spielen'
        + (twNr ? ', 🧤 Nr.\u00a0' + h(twNr) : '') + ')</span>'
        + '<button class="btn btn-sm ' + (twAktiv ? 'btn-acc' : 'btn-out') + '" style="min-height:28px;padding:.125rem .5rem" onclick="gegnerTwModusSet(' + q + ')" aria-label="Torwart wählen">🧤' + (twAktiv ? ' wählen…' : '') + '</button>'
        + '<button class="btn btn-out btn-sm" style="min-height:28px;padding:.125rem .5rem;color:var(--err);border-color:var(--err)" onclick="gegnerViertelReset(' + q + ')" aria-label="Viertel ' + (q+1) + ' zurücksetzen">↺ Reset</button></div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:.25rem">'
        + G.spieler.map(nr => {
            const an = playing.has(nr);
            const isTwQ = twNr === nr;
            const cls = isTwQ ? 'tw' : an ? 'an' : 'ab';
            return '<button class="geg-chip ' + cls + '" onclick="gegnerToggle(' + q + ',\'' + h(nr) + '\')">'
              + (isTwQ ? '🧤' : h(nr)) + '</button>';
          }).join('')
        + '</div></div>';
    }
    html += '</div></div>';
  }

  // Analyse
  if (hasData) {
    const twPerQA = G.twPerQ || [];
    let statRows = G.spieler.map(nr => {
      const sp = spielCount[nr] || 0;
      const bk = benchCount[nr] || 0;
      const isVio = violations.some(v => v.spieler === nr);
      const qDots = Array.from({length: G.viertel}, (_, q) => {
        if (!G.lineup[q] || !G.lineup[q].length) return '<span class="leer">·</span>';
        const an = G.lineup[q].includes(nr);
        const isTwQ = twPerQA[q] === nr;
        if (isTwQ) return '<span class="an" style="background:rgba(245,158,11,.3);color:#d97706">🧤</span>';
        return '<span class="' + (an ? 'an' : 'ab') + '">' + (an ? '✓' : '−') + '</span>';
      }).join('');
      return '<div class="geg-stat-row" style="' + (isVio ? 'background:rgba(239,68,68,.07)' : '') + '">'
        + '<span class="geg-stat-nr" style="' + (isVio ? 'color:var(--err)' : '') + '">' + h(nr) + '</span>'
        + '<div class="geg-qd">' + qDots + '</div>'
        + '<span style="margin-left:auto;font-size:.75rem;color:var(--mut)">' + sp + '×⚽ ' + bk + '×🪑</span>'
        + (isVio ? '<span style="color:var(--err)">⚠️</span>' : '')
        + '</div>';
    }).join('');

    let vioHtml = '';
    if (violations.length) {
      vioHtml = violations.map(v => {
        if (v.type === 'durchspielen')
          return '<div class="geg-vio err">⛔ Nr. ' + h(v.spieler) + ' spielt in allen Vierteln durch!</div>';
        return '<div class="geg-vio warn">⚠️ V' + v.quarter + ': Nr. ' + h(v.spieler)
          + ' pausiert zum 2. Mal — Nr. ' + v.notYet.map(n => h(n)).join(', Nr. ')
          + ' hat/haben noch nicht pausiert!</div>';
      }).join('');
    } else {
      vioHtml = '<div style="color:var(--ok);font-size:.8125rem;margin-top:.375rem;display:flex;align-items:center;gap:.375rem">✅ Keine Regelverstöße erkannt</div>';
    }

    html += '<div class="tr-ber" style="margin-bottom:0"><span class="ber-ti" style="display:block;margin-bottom:.375rem">📊 Analyse</span>'
      + '<div>' + statRows + '</div>' + vioHtml + '</div>';
  }

  el.innerHTML = html;
}

function gegnerSpielerSort() {
  S.gegner.spieler.sort((a, b) => String(a).localeCompare(String(b), 'de', { numeric: true }));
}

function gegnerSpielerAdd() {
  const inp = document.getElementById('geg-nr-input');
  if (!inp) return;
  const nr = inp.value.trim();
  if (!nr) { inp.focus(); return; }
  if (!S.gegner.spieler.includes(nr)) { S.gegner.spieler.push(nr); gegnerSpielerSort(); speichern(); }
  inp.value = '';
  gegnerR();
  requestAnimationFrame(() => { const i = document.getElementById('geg-nr-input'); if (i) i.focus(); });
}

function gegnerSpielerDel(nr) {
  S.gegner.spieler = S.gegner.spieler.filter(s => s !== nr);
  S.gegner.lineup  = S.gegner.lineup.map(q => (q||[]).filter(s => s !== nr));
  S.gegner.twPerQ = (S.gegner.twPerQ||[]).map(t => t === nr ? null : t);
  speichern(); gegnerR();
}


function gegnerViertelSet(v) {
  S.gegner.viertel = v;
  speichern(); gegnerR();
}

let gegnerTwModus = null; // Viertel, in dem gerade der Torwart gewählt wird

function gegnerTwModusSet(q) {
  gegnerTwModus = gegnerTwModus === q ? null : q;
  gegnerR();
}

function gegnerToggle(q, nr) {
  const ln = S.gegner.lineup;
  while (ln.length <= q) ln.push([]);
  const tpq = S.gegner.twPerQ || (S.gegner.twPerQ = []);
  while (tpq.length <= q) tpq.push(null);
  const inLineup = ln[q].includes(nr);
  const isTwQ    = tpq[q] === nr;

  if (gegnerTwModus === q) {
    // Torwart-Modus: Tippen setzt Torwart (nochmal tippen = normaler Feldspieler)
    if (isTwQ) {
      tpq[q] = null;
    } else {
      tpq[q] = nr;
      if (!inLineup) ln[q].push(nr);
    }
    gegnerTwModus = null;
  } else if (!inLineup) {
    ln[q].push(nr);                      // Bank → Feld
  } else {
    ln[q].splice(ln[q].indexOf(nr), 1);  // Feld/TW → Bank
    if (isTwQ) tpq[q] = null;
  }
  speichern(); gegnerR();
}

function gegnerReset() {
  const def = ['1','2','3','5','6','7','8','9','10','11','12'];
  // Nur die Spielerliste zurücksetzen; Aufstellungen pro Viertel bleiben,
  // soweit die Nummern noch in der Liste vorkommen
  S.gegner.spieler = def.slice();
  S.gegner.lineup  = (S.gegner.lineup || []).map(q => (q || []).filter(nr => def.includes(nr)));
  S.gegner.twPerQ  = (S.gegner.twPerQ || []).map(t => def.includes(t) ? t : null);
  speichern(); gegnerR();
}

function gegnerViertelReset(q) {
  if (S.gegner.lineup[q]) S.gegner.lineup[q] = [];
  if (S.gegner.twPerQ) S.gegner.twPerQ[q] = null;
  if (gegnerTwModus === q) gegnerTwModus = null;
  speichern(); gegnerR();
}

// Zahlen für das Spielerprofil: Tore aus gespeicherten Spielen, Viertel aus Aufstellung/Einsatzplan
function spielerStatistik(id, name) {
  const nm = String(name || '').trim().toLowerCase();
  let tore = 0, vorlagen = 0;
  const spiele = new Set();
  (S.dashboardSpiele || []).forEach((sp, i) => (Array.isArray(sp.tore) ? sp.tore : []).forEach(t => {
    if (t.spielerId === id || (nm && String(t.name || '').trim().toLowerCase() === nm)) { tore++; spiele.add(i); }
    if (t.vorlageId === id || (nm && String(t.vorlageName || '').trim().toLowerCase() === nm)) vorlagen++;
  }));
  let viertel = 0;
  const anzahlV = (S.spielplanung && S.spielplanung.viertel) || 4;
  ['A', 'B'].forEach(team => {
    for (let q = 0; q < anzahlV; q++) {
      const d = matchAufstellungDaten(team, q, true);
      if (d && d.row.includes(id)) viertel++;
    }
  });
  return { tore, vorlagen, spiele: spiele.size, viertel };
}

// Bild auf 160x160 (quadratisch, mittig) verkleinern, damit der Speicher nicht vollläuft
function spielerFotoLaden(datei) {
  if (!datei || modal?.typ !== 'foto') return;
  const id = modal.id;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const sp = S.spieler.find(x => x.id === id);
      if (!sp) return;
      const ziel = 160;
      const c = document.createElement('canvas');
      c.width = c.height = ziel;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, ziel, ziel);
      sp.foto = c.toDataURL('image/jpeg', 0.82);
      speichern();
      spielerR(document.getElementById('spieler-suche')?.value);
      torschuetzenR();
      spielerFotoModal(id);
      toastZ('✅ Foto gespeichert', 'ok');
    };
    img.onerror = () => toastZ('Bild konnte nicht gelesen werden.', 'err');
    img.src = e.target.result;
  };
  reader.readAsDataURL(datei);
}

function spielerFotoEntfernen(id) {
  const sp = S.spieler.find(x => x.id === id);
  if (!sp) return;
  delete sp.foto;
  speichern();
  spielerR(document.getElementById('spieler-suche')?.value);
  torschuetzenR();
  spielerFotoModal(id);
  toastZ('✅ Foto entfernt', 'ok');
}

// Bekannte Mannschaften der Liga: damit werden Lesefehler (z. B. "Blonn" statt "Glonn") automatisch korrigiert
const BEKANNTE_TEAMS = [
  'SV Waldperlach U10', 'DJK Fasangarten U10', 'SpVgg Unterhaching U10 3',
  '(SG) Glonn/ Bruck/ Moosach/ Oberpframmern U10', 'FC Unterföhring U10', 'TSV Poing U10',
  'TSV 1877 Ebersberg U10', 'TSV Grasbrunn-Neukeferloh U10', 'SC Baldham-Vaterstetten U10 2'
];

function teamNorm(t) {
  return String(t || '').toLowerCase().replace(/[^a-z0-9äöüß]/g, '');
}

function textAehnlichkeit(a, b) {
  if (!a || !b) return 0;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
  }
  return 1 - d[a.length][b.length] / Math.max(a.length, b.length);
}

function teamKorrigieren(name) {
  const bekannte = BEKANNTE_TEAMS;
  const n = teamNorm(name);
  // Stehen mehrere bekannte Namen im Text (Zeilen zusammengelaufen), zählt der rechte: er gehört zu den Zahlen dahinter
  let treffer = null;
  bekannte.forEach(k => {
    const kn = teamNorm(k);
    const pos = kn ? n.lastIndexOf(kn) : -1;
    if (pos < 0) return;
    const ende = pos + kn.length;
    if (!treffer || ende > treffer.ende || (ende === treffer.ende && kn.length > treffer.laenge)) {
      treffer = { k, ende, laenge: kn.length };
    }
  });
  if (treffer) return treffer.k;
  let best = { k: null, r: 0 };
  bekannte.forEach(k => {
    const r = textAehnlichkeit(n, teamNorm(k));
    if (r > best.r) best = { k, r };
  });
  return best.r >= 0.75 ? best.k : name;
}

// Liest den Text der BFV-Tabelle: "<Name> <Sp> <G-U-V> <Tore>" pro Mannschaft
function tabelleParsen(text) {
  // Typische Lesefehler: Buchstaben statt Ziffern in "4-1-0" und "42:14"
  const ziffernFix = str => str.replace(/[OoDQ]/g, '0').replace(/[Il|]/g, '1');
  const bereinigt = String(text || '')
    .replace(/[–—−‑‒~_]/g, '-')
    .replace(/([\dOoDQIl|]+)\s*-\s*([\dOoDQIl|]+)\s*-\s*([\dOoDQIl|]+)/g, (m, a, b, c) =>
      /\d/.test(m) ? ziffernFix(a) + '-' + ziffernFix(b) + '-' + ziffernFix(c) : m)
    .replace(/(\d+-\d+-\d+)\s+([\dOoDQIl|]+)\s*[:.;,]\s*([\dOoDQIl|]+)/g, (m, g, a, b) => g + ' ' + ziffernFix(a) + ':' + ziffernFix(b))
    .replace(/(\d+-\d{2,3})\s+([\dOoDQIl|]+)\s*[:.;,]\s*([\dOoDQIl|]+)/g, (m, g, a, b) => g + ' ' + ziffernFix(a) + ':' + ziffernFix(b));
  const tokens = bereinigt.split(/\s+/).filter(Boolean);
  const kopf = /^(Mannschaft|Sp\.?|G-U-V|Tore|Diff\.?|Pkt\.?|Punkte|Pl\.?|Platz|#|Tordifferenz)$/i;
  const zahl = /^[+-]?\d+\.?$/;
  const hatBuchstabe = /[A-Za-zÄÖÜäöüß0-9]/;
  const spWert = t => /^\d+$/.test(t) ? Number(t) : ({ S: 5, s: 5, O: 0, o: 0, I: 1, l: 1, '|': 1, B: 8 })[t] ?? null;
  const zeilen = [];
  let start = 0;

  for (let i = 1; i < tokens.length - 1; i++) {
    if (!/^\d+:\d+$/.test(tokens[i + 1])) continue;
    const sp = spWert(tokens[i - 1]);
    if (sp === null) continue;
    let guv = null;
    if (/^\d+-\d+-\d+$/.test(tokens[i])) {
      guv = tokens[i].split('-').map(Number);
    } else {
      // Lesefehler wie "2-11" statt "2-1-1": so aufteilen, dass die Summe zu den Spielen passt
      const m = tokens[i].match(/^(\d+)-(\d{2,3})$/);
      if (m) {
        const g = Number(m[1]);
        for (let c = 1; c < m[2].length; c++) {
          const u = Number(m[2].slice(0, c)), v = Number(m[2].slice(c));
          if (g + u + v === sp) { guv = [g, u, v]; break; }
        }
      }
    }
    if (!guv) continue;

    let name = tokens.slice(start, i - 1);
    let lastKopf = -1;
    name.forEach((t, k) => { if (kopf.test(t)) lastKopf = k; });
    if (lastKopf >= 0) name = name.slice(lastKopf + 1);
    // Rang, Punkte, Logo-Reste und einzelne Buchstaben vorne entfernen, Müll hinten ebenso
    while (name.length > 1 && (zahl.test(name[0]) || !hatBuchstabe.test(name[0]) || /^[A-Za-z]$/.test(name[0]))) name.shift();
    while (name.length > 1 && !hatBuchstabe.test(name[name.length - 1])) name.pop();
    start = i + 2;
    if (!name.length) continue;

    const [tp, tg] = tokens[i + 1].split(':').map(Number);
    zeilen.push({ name: teamKorrigieren(name.join(' ')), sp, g: guv[0], u: guv[1], v: guv[2], tp, tg });
  }
  // Wie bfv.de: Punkte, dann Tordifferenz, dann erzielte Tore
  const pkt = z => z.g * 3 + z.u;
  return zeilen.sort((x, y) => pkt(y) - pkt(x) || (y.tp - y.tg) - (x.tp - x.tg) || y.tp - x.tp);
}

function tabelleFehlende(zeilen) {
  return BEKANNTE_TEAMS.filter(k => !zeilen.some(z => teamNorm(z.name) === teamNorm(k)));
}

let tesseractPromise = null;

function tesseractLaden() {
  if (window.Tesseract) return Promise.resolve();
  if (!tesseractPromise) {
    tesseractPromise = new Promise((ok, fehler) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
      sc.onload = ok;
      sc.onerror = () => { tesseractPromise = null; fehler(new Error('laden')); };
      document.head.appendChild(sc);
    });
  }
  return tesseractPromise;
}

// Bild vergrößern und in Graustufen mit mehr Kontrast umwandeln (bessere Texterkennung)
function bildAufbereiten(datei) {
  return new Promise((ok, fehler) => {
    const url = URL.createObjectURL(datei);
    const img = new Image();
    img.onload = () => {
      const faktor = img.width < 1800 ? 2 : 1;
      const c = document.createElement('canvas');
      c.width = img.width * faktor;
      c.height = img.height * faktor;
      const ctx = c.getContext('2d');
      ctx.filter = 'grayscale(1) contrast(1.3)';
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); fehler(new Error('bild')); };
    img.src = url;
  });
}

// Screenshot → Text (Texterkennung im Browser) → Tabelle
async function tabelleAusBild(datei) {
  if (!datei || modal?.typ !== 'tabelle') return;
  const status = t => {
    const el = document.getElementById('tab-preview');
    if (el && modal?.typ === 'tabelle') el.innerHTML = '<span style="color:var(--mut)">' + h(t) + '</span>';
  };
  try {
    status('Lade Texterkennung …');
    await tesseractLaden();
    status('Lese Bild …');
    const bild = await bildAufbereiten(datei);
    const worker = await Tesseract.createWorker('deu', 1, {
      logger: m => { if (m.status === 'recognizing text') status('Lese Bild … ' + Math.round(m.progress * 100) + ' %'); }
    });
    let text = '';
    try {
      // Mehrere Lesemodi ausprobieren und den nehmen, der die erwartete Zahl an Mannschaften liefert
      const erwartet = BEKANNTE_TEAMS.length;
      let bester = null;
      const modi = ['6', '4', '3']; // Textblock, Spalten, automatisch
      for (let k = 0; k < modi.length; k++) {
        status('Lese Bild … (Versuch ' + (k + 1) + ' von ' + modi.length + ')');
        await worker.setParameters({ tessedit_pageseg_mode: modi[k] });
        const res = await worker.recognize(bild);
        const t = res.data.text || '';
        const abstand = Math.abs(tabelleParsen(t).length - erwartet);
        if (!bester || abstand < bester.abstand) bester = { t, abstand };
        if (abstand === 0) break;
      }
      text = bester ? bester.t : '';
    } finally {
      try { await worker.terminate(); } catch (_) {}
    }
    if (modal?.typ !== 'tabelle') return;
    const ta = document.getElementById('tab-text');
    if (ta) ta.value = text;
    tabelleVorschau();
  } catch (_) {
    status('Texterkennung nicht möglich. Bist du online?');
    toastZ('Bild konnte nicht gelesen werden.', 'err');
  }
}

async function tabelleAusZwischenablage() {
  try {
    const t = await navigator.clipboard.readText();
    const ta = document.getElementById('tab-text');
    if (ta) ta.value = t;
    tabelleVorschau();
  } catch (_) {
    toastZ('Kein Zugriff auf die Zwischenablage – bitte ins Feld einfügen.', 'err');
  }
}

function tabelleVorschau() {
  if (modal?.typ !== 'tabelle') return;

  const passt = zeilen.length === erwartet && !fehlend.length;
  pv.innerHTML = zeilen.length
    ? '<div style="color:' + (passt ? 'var(--ok)' : '#d97706') + ';font-weight:700;margin-bottom:.25rem">' + (passt ? '✅ ' : '⚠️ ') + zeilen.length + ' Mannschaft' + (zeilen.length !== 1 ? 'en' : '') + ' erkannt' + (passt ? '' : ' (erwartet: ' + erwartet + ')') + '</div>'
      + (fehlend.length ? '<div style="color:#d97706;margin-bottom:.375rem">Fehlt: ' + fehlend.map(h).join(', ')

function dashboardModalEinsatz(id, q) {
  if (modal?.typ !== 'dashboardspiel') return;
  const arr = modal.einsaetze[id] || (modal.einsaetze[id] = []);

  if (k >= 0) arr.splice(k, 1); else arr.push(q);
  arr.sort((a, b) => a - b);
  const sp = S.spieler.find(x => x.id === id);
  const el = document.getElementById('ez-' + id);

  const sp = S.dashboardSpiele[modal.index];
  if (!sp) { modalSch(); return; }
  sp.heim = modal.heim;
  sp.auswaerts = modal.auswaerts;
  sp.tore = modal.tore;
  const alteEinsaetze = (Array.isArray(sp.einsaetze) ? sp.einsaetze : []).filter(e => e.spielerId && !S.spieler.some(x => x.id === e.spielerId)); // gelöschte Spieler bleiben erhalten
  const neueEinsaetze = S.spieler.filter(x => (modal.einsaetze[x.id] || []).length)
    .map(x => ({ spielerId: x.id, name: x.name, viertel: modal.einsaetze[x.id].slice() }));
  const alleEinsaetze = alteEinsaetze.concat(neueEinsaetze);
  if (alleEinsaetze.length) sp.einsaetze = alleEinsaetze; else delete sp.einsaetze;
