  if (!el) return;

  const spiele = Array.isArray(S.dashboardSpiele) ? S.dashboardSpiele : [];
  if (!spiele.length) { el.innerHTML = ''; scorerR(); notenR(); einsatzStatistikR(); dbStatistikR(); return; }

  const stat = {};
  let toreGesamt = 0, ohneSchuetze = 0;
  const ohneDaten = spiele.filter(sp => !Array.isArray(sp.tore)).length;

  spiele.forEach((sp, i) => (Array.isArray(sp.tore) ? sp.tore : []).forEach(t => {
    toreGesamt++;
    // Spieler über die ID finden, sonst über den Namen (z. B. wenn der Spieler neu angelegt wurde)
    const nm = String(t.name || '').trim().toLowerCase();
    const aktuell = (t.spielerId && S.spieler.find(x => x.id === t.spielerId))
      || (nm && S.spieler.find(x => String(x.name || '').trim().toLowerCase() === nm))
      || null;
    if (!aktuell && !nm) { ohneSchuetze++; return; }
    const k = aktuell ? aktuell.id : 'n:' + nm;
    if (!stat[k]) stat[k] = { id: aktuell ? aktuell.id : null, name: aktuell ? aktuell.name : t.name, tore: 0, spiele: new Set(), foto: aktuell && aktuell.foto ? aktuell.foto : null };
    stat[k].tore++;
    stat[k].spiele.add(i);
  }));

  const liste = Object.values(stat).sort((a, b) => b.tore - a.tore || a.name.localeCompare(b.name, 'de'));
  const max = liste.length ? liste[0].tore : 1;
  const LIMIT = 5;

  let rang = 0, letzte = null;
  const zeilen = liste.map((x, i) => {
    if (x.tore !== letzte) { rang = i + 1; letzte = x.tore; }
    const medaille = rang === 1 ? '🥇' : rang === 2 ? '🥈' : rang === 3 ? '🥉' : rang + '.';
    return '<li class="we-z" ' + (x.id ? 'onclick="spielerFotoModal(\'' + x.id + '\')" ' : '') + 'style="' + (x.id ? 'cursor:pointer;' : '') + 'flex-direction:column;align-items:stretch;gap:.25rem;padding:.5rem .625rem">'
      + '<div style="display:flex;align-items:center;gap:.5rem">'
      + '<span style="min-width:1.75rem;font-weight:700">' + medaille + '</span>'
      + avatarHtml(x.name, x.foto, 32)
      + '<span style="flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + h(x.name) + '</span>'
      + '<span style="font-size:.75rem;color:var(--mut)">' + x.spiele.size + ' Spiel' + (x.spiele.size !== 1 ? 'e' : '') + '</span>'
      + '<span style="font-weight:800;font-size:1.0625rem;color:var(--sec);min-width:2.5rem;text-align:right">' + x.tore + '⚽</span>'
      + '</div>'
      + '<div style="height:6px;border-radius:3px;background:var(--bg);overflow:hidden">'
      + '<div style="height:100%;width:' + Math.round(x.tore / max * 100) + '%;background:var(--sec);border-radius:3px"></div></div>'
      + '</li>';
  });

  let html = '<div style="margin-bottom:.9rem">'
    + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin-bottom:.5rem">'
    + '<span style="font-size:1rem;font-weight:800;color:var(--prim)">🥇 Torschützen</span>'
    + '<span style="font-size:.6875rem;color:var(--mut)">' + toreGesamt + ' Tore in ' + spiele.length + ' Spiel' + (spiele.length !== 1 ? 'en' : '') + '</span></div>';

  if (!liste.length) {
    html += '<p style="color:var(--mut);font-size:.8125rem">Noch keine Torschützen erfasst.</p>';
  } else {
    html += '<ul style="list-style:none;display:flex;flex-direction:column;gap:.375rem">'
      + zeilen.slice(0, dbAlleTorschuetzen ? zeilen.length : LIMIT).join('') + '</ul>';
    if (zeilen.length > LIMIT) {
      html += '<button class="btn btn-out btn-sm btn-full" type="button" style="margin-top:.5rem" onclick="dbTorschuetzenUmschalten()">'
        + (dbAlleTorschuetzen ? 'Weniger anzeigen' : 'Alle ' + zeilen.length + ' Torschützen anzeigen') + '</button>';
    }
  }

  const hinweise = [];
  if (ohneSchuetze) hinweise.push(ohneSchuetze + ' Tor' + (ohneSchuetze !== 1 ? 'e' : '') + ' ohne gewählten Torschützen');
  if (ohneDaten) hinweise.push(ohneDaten + ' älteres Spiel' + (ohneDaten !== 1 ? 'e' : '') + ' ohne Torschützen-Daten (zum Ergänzen das Spiel mit ✏️ bearbeiten)');
  if (hinweise.length) {
    html += '<p style="color:var(--mut);font-size:.75rem;margin-top:.625rem">ℹ️ ' + hinweise.map(h).join('<br>ℹ️ ') + '</p>';
  }

  el.innerHTML = html + '</div>';
  scorerR();
  notenR();
  einsatzStatistikR();
  dbStatistikR();
}

let dbAlleScorer = false;

function dbScorerUmschalten() {
  dbAlleScorer = !dbAlleScorer;
  scorerR();
}

// Scorerliste: Tore + Vorlagen aus den gespeicherten Spielen
function scorerR() {
  const el = document.getElementById('db-scorer');
  if (!el) return;
  const spiele = Array.isArray(S.dashboardSpiele) ? S.dashboardSpiele : [];
  const stat = {};
  let hatVorlagen = false;

  const zuordnen = (id, name) => {
    const nm = String(name || '').trim().toLowerCase();
    const aktuell = (id && S.spieler.find(x => x.id === id)) || (nm && S.spieler.find(x => String(x.name || '').trim().toLowerCase() === nm)) || null;
    if (!aktuell && !nm) return null;
    const k = aktuell ? aktuell.id : 'n:' + nm;
    if (!stat[k]) stat[k] = { id: aktuell ? aktuell.id : null, name: aktuell ? aktuell.name : name, foto: aktuell && aktuell.foto ? aktuell.foto : null, tore: 0, vorlagen: 0 };
    return stat[k];
  };

  spiele.forEach(sp => (Array.isArray(sp.tore) ? sp.tore : []).forEach(t => {
    if (t.vorlageId || t.vorlageName) hatVorlagen = true;
    const a = zuordnen(t.spielerId, t.name); if (a) a.tore++;
    const v = zuordnen(t.vorlageId, t.vorlageName); if (v) v.vorlagen++;
  }));

  if (!hatVorlagen) { el.innerHTML = ''; return; }   // erst anzeigen, wenn Vorlagen erfasst sind

  const liste = Object.values(stat).sort((a, b) =>
    (b.tore + b.vorlagen) - (a.tore + a.vorlagen) || b.tore - a.tore || a.name.localeCompare(b.name, 'de'));
  const LIMIT = 5;
  const c = 'padding:.4rem .2rem;text-align:center;white-space:nowrap';
  const th = 'padding:.35rem .2rem;text-align:center;font-weight:700';
  const rows = liste.slice(0, dbAlleScorer ? liste.length : LIMIT).map((x, i) =>
    '<tr ' + (x.id ? 'onclick="spielerFotoModal(\'' + x.id + '\')" style="cursor:pointer;' : 'style="') + (i % 2 ? 'background:rgba(148,163,184,.08);' : '') + '">'
    + '<td style="' + c + ';color:var(--mut);font-weight:700;padding-left:.5rem">' + (i + 1) + '</td>'
    + '<td style="padding:.3rem .25rem;text-align:left"><span style="display:flex;align-items:center;gap:.4rem;min-width:0">' + avatarHtml(x.name, x.foto, 24)
    + '<span style="font-size:.8125rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + h(x.name) + '</span></span></td>'
    + '<td style="' + c + '">' + x.tore + '</td>'
    + '<td style="' + c + '">' + x.vorlagen + '</td>'
    + '<td style="' + c + ';font-weight:800;color:var(--prim);padding-right:.5rem">' + (x.tore + x.vorlagen) + '</td></tr>').join('');

  el.innerHTML = '<div style="margin-bottom:.9rem">'
    + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin-bottom:.5rem">'
    + '<span style="font-size:1rem;font-weight:800;color:var(--prim)">🏅 Scorerliste</span>'
    + '<span style="font-size:.6875rem;color:var(--mut)">Tore + Vorlagen</span></div>'
    + '<div class="karte" style="padding:.5rem .25rem"><table style="width:100%;border-collapse:collapse;font-size:.75rem">'
    + '<thead><tr style="color:var(--mut);font-size:.625rem;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--brd)">'
    + '<th style="' + th + ';padding-left:.5rem">#</th><th style="' + th + ';text-align:left">Spieler</th>'
    + '<th style="' + th + '">Tore</th><th style="' + th + '">Vorl.</th><th style="' + th + ';padding-right:.5rem">Pkt</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table></div>'
    + (liste.length > LIMIT
        ? '<button class="btn btn-out btn-sm btn-full" type="button" style="margin-top:.5rem" onclick="dbScorerUmschalten()">' + (dbAlleScorer ? 'Weniger anzeigen' : 'Alle ' + liste.length + ' anzeigen') + '</button>'
        : '')
    + '</div>';
}

/* ===== SPIELNOTEN (Schulnoten 1–6 je Spiel, mit gespielter Position) ===== */

const NOTEN = [1, 2, 3, 4, 5, 6];
const POS_FARBE = { Torwart: '#8b5cf6', Abwehr: '#2563EB', 'Defensives Mittelfeld': '#0D9488', Mittelfeld: '#10B981', 'Offensives Mittelfeld': '#84CC16', Sturm: '#F59E0B' };

function notenFormat(x) { return (Math.round(x * 10) / 10).toFixed(1).replace('.', ','); }
function notenFarbe(x) { return x <= 2.5 ? '#10B981' : x <= 4 ? '#d97706' : '#EF4444'; }

// Alle Noten eines Spielers, älteste zuerst (Spiele sind neueste zuerst gespeichert)
function notenEintraege(id, name) {
  const nm = String(name || '').trim().toLowerCase();
  const liste = [];
  S.dashboardSpiele.slice().reverse().forEach(sp => (Array.isArray(sp.noten) ? sp.noten : []).forEach(n => {
    const gleich = (n.spielerId && n.spielerId === id) || (nm && String(n.name || '').trim().toLowerCase() === nm);
    if (!gleich || !Number(n.note)) return;
    liste.push({
      note: Number(n.note), pos: n.pos || '', datum: sp.datum || '',
      gegner: sp.unsereSeite === 'heim' ? sp.auswaertsName : sp.heimName
    });
  }));
  return liste;
}

function notenZusammenfassung(liste) {
  const summe = liste.reduce((a, e) => a + e.note, 0);
  const proPos = {};
  liste.forEach(e => {
    const k = e.pos || '–';
    if (!proPos[k]) proPos[k] = { summe: 0, anzahl: 0 };
    proPos[k].summe += e.note;
    proPos[k].anzahl++;
  });
  return { schnitt: liste.length ? summe / liste.length : 0, anzahl: liste.length, proPos };
}

// Verlaufsdiagramm: oben = Note 1, unten = Note 6, Farbe/Buchstabe = gespielte Position
function notenVerlaufSvg(liste) {
  const L = liste.slice(-12);
  const W = 300, H = 128, links = 22, rechts = 12, oben = 10, unten = 26;
  const pw = W - links - rechts, ph = H - oben - unten;
  const y = n => oben + (n - 1) / 5 * ph;
  const x = i => L.length === 1 ? links + pw / 2 : links + i * pw / (L.length - 1);
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Verlauf der Spielnoten" style="display:block">';
  NOTEN.forEach(n => {
    svg += '<line x1="' + links + '" y1="' + y(n) + '" x2="' + (W - rechts) + '" y2="' + y(n) + '" stroke="#E2E8F0" stroke-width="1"/>'
      + '<text x="' + (links - 6) + '" y="' + (y(n) + 3) + '" font-size="9" fill="#64748B" text-anchor="end">' + n + '</text>';
  });
  if (L.length > 1) {
    svg += '<polyline fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" points="' + L.map((e, i) => x(i) + ',' + y(e.note)).join(' ') + '"/>';
  }
  L.forEach((e, i) => {
    const farbe = POS_FARBE[e.pos] || '#64748B';
    svg += '<circle cx="' + x(i) + '" cy="' + y(e.note) + '" r="5" fill="' + farbe + '" stroke="#fff" stroke-width="1.5"/>'
      + '<text x="' + x(i) + '" y="' + (H - 12) + '" font-size="8" fill="' + farbe + '" font-weight="700" text-anchor="middle">' + h(POS_SHORT[e.pos] || '–') + '</text>'
      + '<text x="' + x(i) + '" y="' + (H - 3) + '" font-size="7" fill="#64748B" text-anchor="middle">' + h(String(e.datum).slice(0, 5)) + '</text>';
  });
  return svg + '</svg>';
}

function notenProfilHtml(sp) {
  const liste = notenEintraege(sp.id, sp.name);
  const kopf = '<div style="margin-bottom:1rem"><div style="font-size:.8125rem;font-weight:700;color:var(--txt);margin-bottom:.375rem">📈 Spielnoten</div>';
  if (!liste.length) return kopf + '<p style="color:var(--mut);font-size:.8125rem">Noch keine Noten. Im Dashboard bei einem Spiel auf 📝 tippen.</p></div>';
  const z = notenZusammenfassung(liste);
  const pos = Object.keys(z.proPos).map(k =>
    '<span style="display:inline-block;margin:0 .5rem .25rem 0;font-size:.75rem"><b style="color:' + (POS_FARBE[k] || '#64748B') + '">' + h(POS_SHORT[k] || k) + '</b> Ø '
    + notenFormat(z.proPos[k].summe / z.proPos[k].anzahl) + ' (' + z.proPos[k].anzahl + '×)</span>').join('');
  const letzte = liste.slice(-5).reverse().map(e =>
    '<div style="display:flex;justify-content:space-between;font-size:.75rem;padding:.2rem 0;border-top:1px solid var(--brd)">'
    + '<span style="color:var(--mut)">' + h(String(e.datum).slice(0, 6)) + ' gegen ' + h(e.gegner || '') + ' · ' + h(POS_SHORT[e.pos] || '–') + '</span>'
    + '<b style="color:' + notenFarbe(e.note) + '">' + e.note + '</b></div>').join('');
  return kopf
    + '<div style="display:flex;align-items:baseline;gap:.5rem;margin-bottom:.25rem"><span style="font-size:1.5rem;font-weight:800;color:' + notenFarbe(z.schnitt) + '">Ø ' + notenFormat(z.schnitt) + '</span>'
    + '<span style="font-size:.75rem;color:var(--mut)">' + z.anzahl + ' Spiel' + (z.anzahl !== 1 ? 'e' : '') + '</span></div>'
    + notenVerlaufSvg(liste)
    + '<div style="margin:.375rem 0">' + pos + '</div>' + letzte + '</div>';
}

function notenModalOeffnen(index) {
  const sp = S.dashboardSpiele[index];
  if (!sp) return;
  const noten = {}, pos = {};
  (Array.isArray(sp.noten) ? sp.noten : []).forEach(n => { if (n.spielerId) { noten[n.spielerId] = Number(n.note); pos[n.spielerId] = n.pos; } });
  modal = { typ: 'noten', id: null, sterne: {}, index, noten, pos };
  const gegner = sp.unsereSeite === 'heim' ? sp.auswaertsName : sp.heimName;
  document.getElementById('modal-ti').textContent = 'Spielnoten';
  document.getElementById('modal-body').innerHTML =
    '<p style="font-size:.8125rem;color:var(--mut);margin-bottom:.5rem">' + h(sp.datum || '') + ' gegen ' + h(gegner || '') + ' (' + sp.heim + ':' + sp.auswaerts + ')<br>'
    + '1 = sehr gut … 6 = ungenügend. Wer nicht gespielt hat, bekommt keine Note. Die Position ist die, auf der er gespielt hat.</p>'
    + (S.spieler.length ? S.spieler.map(notenZeileHtml).join('') : '<p style="color:var(--mut)">Noch keine Spieler.</p>');
  modalFooterSichtbar(true);
  document.getElementById('modal-ov').classList.remove('hidden');
}

function notenZeileAktualisieren(id) {
  const s = S.spieler.find(x => x.id === id);
  const el = document.getElementById('nr-' + id);
  if (s && el) el.outerHTML = notenZeileHtml(s);
}

function notenSetzen(id, n) {
  if (modal?.typ !== 'noten') return;
  if (modal.noten[id] === n) delete modal.noten[id]; else modal.noten[id] = n;   // nochmal tippen = Note entfernen
  notenZeileAktualisieren(id);
}

function notenPos(id, pos) {
  if (modal?.typ !== 'noten') return;
  modal.pos[id] = pos;
}

function notenSpeichern() {
  if (modal?.typ !== 'noten') return;
  const sp = S.dashboardSpiele[modal.index];
  if (!sp) { modalSch(); return; }
  const behalten = (Array.isArray(sp.noten) ? sp.noten : []).filter(n => n.spielerId && !S.spieler.some(x => x.id === n.spielerId)); // gelöschte Spieler bleiben erhalten
  const neu = S.spieler.filter(s => modal.noten[s.id]).map(s => ({
    spielerId: s.id, name: s.name, pos: modal.pos[s.id] || s.position || 'Mittelfeld', note: modal.noten[s.id]
  }));
  const alle = behalten.concat(neu);
  if (alle.length) sp.noten = alle; else delete sp.noten;
  speichern();
  modalSch();
  dbR();
  toastZ('✅ Spielnoten gespeichert', 'ok');
}

/* --- Statistik im Dashboard --- */

let dbAlleNoten = false;

function dbNotenUmschalten() {
  dbAlleNoten = !dbAlleNoten;
  notenR();
}

function notenR() {

    + '<td style="' + c + ';color:var(--mut);font-weight:700;padding-left:.5rem">' + (i + 1) + '</td>'
    + '<td style="padding:.3rem .25rem;text-align:left"><span style="display:flex;align-items:center;gap:.4rem;min-width:0">' + avatarHtml(x.s.name, x.s.foto, 24)
    + '<span style="font-size:.8125rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + h(x.s.name) + '</span></span></td>'
    + '<td style="' + c + ';font-weight:800;color:' + notenFarbe(x.z.schnitt) + '">' + notenFormat(x.z.schnitt) + '</td>'
    + '<td style="' + c + '">' + x.z.anzahl + '</td>'
    + '<td style="' + c + ';padding-right:.5rem"><b style="color:' + (POS_FARBE[x.haeufig] || '#64748B') + '">' + h(POS_SHORT[x.haeufig] || '–') + '</b></td></tr>').join('');

  el.innerHTML = '<div style="margin-bottom:.9rem">'
    + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin-bottom:.5rem">'
    + '<span style="font-size:1rem;font-weight:800;color:var(--prim)">📈 Spielnoten</span>'
    + '<span style="font-size:.6875rem;color:var(--mut)">Spieler antippen für den Verlauf</span></div>'
    + '<div class="karte" style="padding:.5rem .25rem"><table style="width:100%;border-collapse:collapse;font-size:.75rem">'
    + '<thead><tr style="color:var(--mut);font-size:.625rem;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--brd)">'
    + '<th style="' + th + ';padding-left:.5rem">#</th><th style="' + th + ';text-align:left">Spieler</th>'
    + '<th style="' + th + '">Ø Note</th><th style="' + th + '">Spiele</th><th style="' + th + ';padding-right:.5rem">Pos.</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table></div>'
    + (zeilen.length > LIMIT
        ? '<button class="btn btn-out btn-sm btn-full" type="button" style="margin-top:.5rem" onclick="dbNotenUmschalten()">' + (dbAlleNoten ? 'Weniger anzeigen' : 'Alle ' + zeilen.length + ' anzeigen') + '</button>'
        : '')
    + '</div>';
}

/* ===== EINSÄTZE (wie oft hat jeder Spieler gespielt) ===== */

// Beim Speichern eines Spiels: Viertel je Spieler aus der Aufstellung bzw. dem Einsatzplan übernehmen
function einsaetzeAusAufstellung() {
  const team = teamBAktiv() && S.aufstellung && S.aufstellung.team === 'B' ? 'B' : 'A';
  const proSpieler = {};
  for (let q = 0; q < spielTimer.viertel; q++) {
    const d = matchAufstellungDaten(team, q);
    if (!d) continue;
    d.row.filter(Boolean).forEach(id => { (proSpieler[id] = proSpieler[id] || []).push(q + 1); });
  }
  return Object.keys(proSpieler).map(id => ({
    spielerId: id,
    name: (S.spieler.find(x => x.id === id) || {}).name || '',
    viertel: proSpieler[id]
  }));
}

function einsatzFarbe(pct) { return pct >= 70 ? '#10B981' : pct >= 50 ? '#d97706' : '#EF4444'; }

function einsatzStatistik() {
  const alle = Array.isArray(S.dashboardSpiele) ? S.dashboardSpiele : [];
  const spiele = alle.filter(sp => Array.isArray(sp.einsaetze) && sp.einsaetze.length);
  const N = spiele.length;
  const stat = {};
  const zuordnen = (id, name) => {
    const nm = String(name || '').trim().toLowerCase();
    const aktuell = (id && S.spieler.find(x => x.id === id)) || (nm && S.spieler.find(x => String(x.name || '').trim().toLowerCase() === nm)) || null;
    if (!aktuell && !nm) return null;
    const k = aktuell ? aktuell.id : 'n:' + nm;
    if (!stat[k]) stat[k] = { id: aktuell ? aktuell.id : null, name: aktuell ? aktuell.name : name, foto: aktuell && aktuell.foto ? aktuell.foto : null, spiele: 0, viertel: 0 };
    return stat[k];
  };
  S.spieler.forEach(s => zuordnen(s.id, s.name));   // auch Spieler ohne Einsatz erscheinen
  spiele.forEach(sp => sp.einsaetze.forEach(e => {
    const z = zuordnen(e.spielerId, e.name);
    const n = Array.isArray(e.viertel) ? e.viertel.length : 0;
    if (z && n > 0) { z.spiele++; z.viertel += n; }
  }));
  const mog = N * spielTimer.viertel;
  const zeilen = Object.values(stat)
    .map(z => Object.assign(z, { pct: mog ? Math.round(z.viertel / mog * 100) : 0 }))
    .sort((a, b) => b.viertel - a.viertel || b.spiele - a.spiele || a.name.localeCompare(b.name, 'de'));
  return { N, ohneDaten: alle.length - N, mog, zeilen };
}

function einsatzProfilHtml(sp) {
  const st = einsatzStatistik();
  if (!st.N) return '';
  const z = st.zeilen.find(x => x.id === sp.id);

  return '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin-bottom:1rem;padding:.5rem .625rem;background:var(--bg);border:1px solid var(--brd);border-radius:var(--rs)">'

}

const SPIELPLAN_URL = 'https://service-prod.bfv.de/rest/pdfexport/Spielplan?staffel=031I9A7JJK000007VS5489BUVVKNMR0J-G';
function spielplanUrl() { return urlNormalisieren(einst().linkSpielplan) || SPIELPLAN_URL; }

function spielplanListe() {
  if (!S.spielplan || !Array.isArray(S.spielplan.spiele)) S.spielplan = { spiele: [], stand: '' };
  return S.spielplan.spiele;
}
function planSpiel(id) { return spielplanListe().find(x => x.id === id) || null; }
function planEintrag(id) { return (S.dashboardSpiele || []).find(x => x.spielplanId === id) || null; }
function planNachDatum(liste) { return liste.slice().sort((a, b) => String(a.datum).localeCompare(String(b.datum)) || String(a.zeit || '').localeCompare(String(b.zeit || ''))); }
// offen = noch nicht mit einem Match verknüpft und im Plan ohne Ergebnis
function planOffen() { return planNachDatum(spielplanListe().filter(g => !planEintrag(g.id) && !g.ergebnis)); }
function planZuordnungsListe() { return planNachDatum(spielplanListe().filter(g => !planEintrag(g.id))); }
function datumDe(iso) { const d = new Date(iso + 'T12:00:00'); return isNaN(d.getTime()) ? String(iso) : d.toLocaleDateString('de-DE'); }
function planKurz(n) {
  let t = String(n || '').replace(/\s+U\d+.*$/i, '').replace(/^\(SG\)\s*/i, 'SG ').trim();
  return t.length > 24 ? t.slice(0, 23) + '…' : t;
}
function planTeamsText(g) {
  const l = g.unsereSeite === 'heim' ? eigenKurz() : planKurz(g.heim);
  const r = g.unsereSeite === 'heim' ? planKurz(g.auswaerts) : eigenKurz();
  return h(l) + ' - ' + h(r);
}
// Spielort als Link in die Karten-App
function planOrtHtml(g) {

  return '<div style="margin-top:.25rem;font-size:.75rem"><a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(g.ort) + '" target="_blank" rel="noopener" style="color:var(--sec);text-decoration:none">📍 ' + h(g.ort) + '</a></div>';

/* --- Text aus dem Spielplan (PDF-Text) in Spiele umwandeln --- */
function spielplanParsen(text) {
  const t = String(text || '').replace(/[\u00a0\t]+/g, ' ');
  const verein = String(vereinName() || '').trim().toLowerCase();
  const namen = [...new Set(BEKANNTE_TEAMS.concat(((S.tabelle && S.tabelle.zeilen) || []).map(z => z.name)))];
  const esc = w => w.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&');
  const teilRe = txt => new RegExp(txt.trim().split(/\s+/).map(esc).join('\\s*'), 'i');
  const rx = namen.map(n => {
    const kern = n.replace(/\s+U\d+.*$/i, '').trim();
    if (!kern) return null;
    const muster = kern.split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&')).join('\\s*');
    return { name: n, re: new RegExp(muster, 'i') };
  }).filter(Boolean);

  const dre = /(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2})(?!\d)/g;
  const treffer = [];
  let m;
  while ((m = dre.exec(t))) treffer.push({ i: m.index, end: m.index + m[0].length, d: +m[1], mo: +m[2], y: +m[3] });

  const spiele = [];
  let uebersprungen = 0;
  treffer.forEach((hit, k) => {
    const rec = t.slice(hit.end, k + 1 < treffer.length ? treffer[k + 1].i : t.length);
    const y = hit.y < 100 ? 2000 + hit.y : hit.y;
    if (hit.mo < 1 || hit.mo > 12 || hit.d < 1 || hit.d > 31) return;
    if (/SPIELFREI/i.test(rec)) return;   // spielfreie Woche, kein Spiel
    const tm = /(^|[^\d])(\d{1,2}):(\d{2})(?!\d)/.exec(rec);
    const tmIdx = tm ? tm.index + tm[1].length : -1;
    const zeit = tm ? String(tm[2]).padStart(2, '0') + ':' + tm[3] : '';
    const scoreRe = /(\d{1,2})\s*:\s*(\d{1,2})(?!\d)/;
    let heim, ausw, sm = null;

    // Lange Namen wie „(SG) Glonn/ Bruck/ Moosach/ Oberpframmern“ sind im PDF auf mehrere Zeilen verteilt
    const wr = namen.filter(n => n.includes('/')).map(n => { const k = n.lastIndexOf('/') + 1; return { name: n, p1: n.slice(0, k), p2: n.slice(k) }; })
      .find(w => { const voll = rx.find(x => x.name === w.name); return voll && !voll.re.test(rec) && teilRe(w.p1).test(rec) && teilRe(w.p2).test(rec); });
    if (wr) {
      const rest = rec.replace(teilRe(wr.p1), '  ').replace(teilRe(wr.p2), '  ');
      const andere = rx.filter(x => x.name !== wr.name).map(x => ({ x, m: x.re.exec(rest) })).filter(o => o.m).sort((a, b) => a.m.index - b.m.index)[0];
      if (!andere) { if (verein && rec.toLowerCase().includes(verein)) uebersprungen++; return; }
      // Steht der Bindestrich direkt hinter dem anderen Team, ist die SG Gast; steht er allein in einer Zeile, ist die SG Heim
      const zeile = rest.slice(andere.m.index + andere.m[0].length).split('\n')[0].replace(/^\s*U\d+(\s+\d)?/i, '');
      const sgGast = /^\s*-/.test(zeile);
      heim = sgGast ? andere.x.name : wr.name;
      ausw = sgGast ? wr.name : andere.x.name;
      sm = scoreRe.exec(zeit ? rest.replace(tm[2] + ':' + tm[3], ' ') : rest);
    } else {
      const gef = [];
      rx.forEach(x => { const mm = x.re.exec(rec); if (mm) gef.push({ name: x.name, i: mm.index, end: mm.index + mm[0].length }); });
      const f = gef.filter(a => !gef.some(b => b !== a && b.i <= a.i && b.end >= a.end && (b.end - b.i) > (a.end - a.i)));
      f.sort((a, b) => a.i - b.i);
      if (f.length < 2) { if (verein && rec.toLowerCase().includes(verein)) uebersprungen++; return; }
      heim = f[0].name; ausw = f[1].name;
      const tail = rec.slice(f[1].end);
      const s1 = scoreRe.exec(tail);
      if (s1 && f[1].end + s1.index !== tmIdx) sm = s1;
    }
    const eigenHeim = !verein || heim.toLowerCase().includes(verein);
    const eigenAusw = !verein || ausw.toLowerCase().includes(verein);
    if (!eigenHeim && !eigenAusw) return;
    let ergebnis = sm ? { heim: +sm[1], auswaerts: +sm[2] } : null;
    const iso = y + '-' + String(hit.mo).padStart(2, '0') + '-' + String(hit.d).padStart(2, '0');
    if (spiele.some(s => s.datum === iso && s.heim === heim && s.auswaerts === ausw)) return;
    const g = { datum: iso, zeit, heim, auswaerts: ausw, unsereSeite: eigenHeim ? 'heim' : 'auswaerts' };
    if (ergebnis) g.ergebnis = ergebnis;
    spiele.push(g);
  });
  return { spiele: planNachDatum(spiele), uebersprungen };
}

/* --- PDF im Browser lesen (pdf.js, Internet nötig) --- */
let pdfjsPromise = null;
function pdfjsLaden() {
  if (window.pdfjsLib) return Promise.resolve();
  if (!pdfjsPromise) {
    pdfjsPromise = new Promise((ok, fehler) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
      sc.onload = () => { try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; ok(); } catch (e) { fehler(e); } };
      sc.onerror = () => { pdfjsPromise = null; fehler(new Error('laden')); };
      document.head.appendChild(sc);
    });
  }
  return pdfjsPromise;
}

async function spielplanPdfLesen(datei) {
  if (!datei || modal?.typ !== 'spielplanimport') return;
  const pv = document.getElementById('sp-preview');
  if (pv) pv.innerHTML = '<span style="color:var(--mut)">Lese PDF …</span>';
  try {
    await pdfjsLaden();
    const pdf = await pdfjsLib.getDocument({ data: await datei.arrayBuffer() }).promise;
    let out = '';
    for (let p = 1; p <= pdf.numPages; p++) {
      const tc = await (await pdf.getPage(p)).getTextContent();
      const zeilen = [];
      tc.items.forEach(it => {
        if (!it.str || !it.str.trim()) return;
        const y = Math.round(it.transform[5]);
        let z = zeilen.find(l => Math.abs(l.y - y) <= 3);
        if (!z) { z = { y, teile: [] }; zeilen.push(z); }
        z.teile.push({ x: it.transform[4], s: it.str });
      });
      zeilen.sort((a, b) => b.y - a.y).forEach(z => { out += z.teile.sort((a, b) => a.x - b.x).map(x => x.s).join(' ') + '\n'; });
    }
    if (modal?.typ !== 'spielplanimport') return;
    const ta = document.getElementById('sp-text');
    if (ta) ta.value = out;
    spielplanVorschau();
  } catch (_) {
    if (pv) pv.innerHTML = '<span style="color:var(--err)">PDF konnte nicht gelesen werden. Bist du online? Alternativ den Text aus dem PDF kopieren und einfügen.</span>';
  }
}

function spielplanVorschau() {
  if (modal?.typ !== 'spielplanimport') return;
  const text = document.getElementById('sp-text')?.value || '';

  modal.spiele = r.spiele;
  const pv = document.getElementById('sp-preview');
  if (!pv) return;
  pv.innerHTML = r.spiele.length
    ? '<div style="color:var(--ok);font-weight:700;margin-bottom:.25rem">✅ ' + r.spiele.length + ' Spiel' + (r.spiele.length !== 1 ? 'e' : '') + ' erkannt</div>'
      + (r.uebersprungen ? '<div style="color:#d97706;margin-bottom:.25rem">⚠️ ' + r.uebersprungen + ' Eintrag' + (r.uebersprungen !== 1 ? 'e' : '') + ' nicht lesbar</div>' : '')
      + '<ol style="padding-left:1.25rem;line-height:1.5">' + r.spiele.map(g => '<li>' + h(datumAnzeige(g.datum)) + (g.zeit ? ' ' + h(g.zeit) : '') + ': ' + planTeamsText(g)
        + (g.ergebnis ? ' <span style="color:var(--mut)">(' + g.ergebnis.heim + ':' + g.ergebnis.auswaerts + ')</span>' : '') + '</li>').join('') + '</ol>'
    : (text.trim() ? '<span style="color:var(--err)">Keine Spiele deiner Mannschaft erkannt.</span>' : '');
}

function spielplanUebernehmen() {
  if (modal?.typ !== 'spielplanimport') return;
  spielplanVorschau();
  const neueSpiele = modal.spiele;
  if (!neueSpiele.length) { toastZ('Keine Spiele erkannt!', 'err'); return; }
  const liste = spielplanListe();
  let neu = 0, akt = 0;
  neueSpiele.forEach(g => {
    const x = liste.find(y => y.datum === g.datum && y.heim === g.heim && y.auswaerts === g.auswaerts);
    if (x) { if (g.zeit) x.zeit = g.zeit; if (g.ergebnis) x.ergebnis = g.ergebnis; akt++; }
    else { liste.push(Object.assign({ id: genId() }, g)); neu++; }
  });
  S.spielplan.spiele = planNachDatum(liste);
  S.spielplan.stand = new Date().toLocaleDateString('de-DE');
  speichern();
  modalSch();
  dbR();
  spielplanR();
  coTrainerTeamAAutoSync();
  toastZ('✅ Spielplan: ' + neu + ' neu, ' + akt + ' aktualisiert', 'ok');
}

  const v = String(vereinName() || '').trim().toLowerCase();

function planSpielLoeschen(id) {
  const g = planSpiel(id);
  if (!g) return;
  bestaetigen('Spiel löschen', 'Das Spiel vom ' + datumAnzeige(g.datum) + ' aus dem Spielplan löschen?' + (planEintrag(id) ? ' Das gespeicherte Ergebnis bleibt erhalten.' : ''), 'Löschen', () => {
    S.spielplan.spiele = S.spielplan.spiele.filter(x => x.id !== id);
    if (S.planungSpielId === id) S.planungSpielId = null;
    speichern();
    dbR();
    spielplanR();
    coTrainerTeamAAutoSync();
  });
}

/* --- Ergebnis einem Spielplan-Spiel zuordnen --- */
function planWahlOeffnen(modus) {
  const liste = planZuordnungsListe();
  const heute = Date.now();
  const kandidaten = liste.filter(g => !g.ergebnis);
  const nah = (kandidaten.length ? kandidaten : liste).reduce((b, g) => !b || Math.abs(new Date(g.datum + 'T12:00:00') - heute) < Math.abs(new Date(b.datum + 'T12:00:00') - heute) ? g : b, null);
  const zuweisen = modus === 'zuweisen';
  modal = { typ: 'planwahl', id: null, sterne: {}, modus: zuweisen ? 'zuweisen' : 'speichern' };
  document.getElementById('modal-ti').textContent = zuweisen ? 'Spiel aus dem Spielplan wählen' : 'Zu welchem Spiel gehört das Ergebnis?';
  const st = S.spielstand || { heim: 0, auswaerts: 0 };
  document.getElementById('modal-body').innerHTML =
    '<p style="font-size:.8125rem;color:var(--mut);margin-bottom:.625rem">' + (zuweisen ? 'Heim/Auswärts und Gegner werden übernommen, das Ergebnis wird später diesem Spiel zugeordnet.' : 'Aktueller Spielstand: ' + st.heim + ' - ' + st.auswaerts) + '</p>'
    + '<div style="display:flex;flex-direction:column;gap:.5rem">'
    + liste.map(g => '<button class="btn ' + (nah && g.id === nah.id ? 'btn-prim' : 'btn-out') + '" type="button" style="justify-content:flex-start;text-align:left;white-space:normal;flex-direction:column;align-items:flex-start;gap:.125rem" onclick="planWahlGewaehlt(\'' + g.id + '\')">'
      + '<span style="font-size:.75rem;opacity:.8">' + h(planDatumText(g)) + ' · ' + (g.unsereSeite === 'heim' ? 'Heim' : 'Auswärts') + (g.ergebnis ? ' · Plan: ' + g.ergebnis.heim + ':' + g.ergebnis.auswaerts : '') + '</span>'
      + '<span>' + planTeamsText(g) + '</span></button>').join('')
    + '<button class="btn btn-out" type="button" onclick="planWahlGewaehlt(\'\')">' + (zuweisen ? 'Zuweisung entfernen' : 'Ohne Spielplan speichern') + '</button>'
    + '<button class="btn btn-out" type="button" onclick="modalSch()">Abbrechen</button></div>';
  modalFooterSichtbar(false);
  document.getElementById('modal-ov').classList.remove('hidden');
}

function planWahlGewaehlt(id) {
  const zuweisen = modal && modal.modus === 'zuweisen';
  modalSch();
  if (zuweisen) matchPlanZuweisen(id); else dashboardSpielSpeichern(id);
}

// Kürzel (3 Buchstaben) aus dem Gegnernamen, ohne Vereinsvorsätze wie TSV, FC, SV
function gegnerCodeAusName(n) {
  let t = String(n || '').replace(/\s+U\d+.*$/i, '').replace(/^\(SG\)\s*/i, '').trim();
  let vorher;
  do { vorher = t; t = t.replace(/^(FC|TSV|SV|SC|DJK|SPVGG|SG|TUS|FSV|VFB|VFL|SSV|ASV)\s+/i, ''); } while (t !== vorher);
  return t.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3) || 'GEG';
}

// Match einem Spiel aus dem Spielplan zuweisen: Heim/Auswärts und Gegner kommen von dort
function matchPlanZuweisen(id) {
  if (!S.spielstand) S.spielstand = { heim: 0, auswaerts: 0, tore: [], unsereMannschaft: 'heim' };
  const pg = id ? planSpiel(id) : null;
  if (!pg) {
    delete S.spielstand.planId;
    speichern(); dbR();
    toastZ('Zuweisung entfernt', 'ok');
    return;
  }
  S.spielstand.planId = pg.id;
  setGegnerCode(gegnerCodeAusName(pg.unsereSeite === 'heim' ? pg.auswaerts : pg.heim), false);
  if (S.spielstand.unsereMannschaft !== pg.unsereSeite) spielstandSeiteWechseln(pg.unsereSeite);
  if (S.planungSpielId !== pg.id) planungSpielWaehlen(pg.id);   // Aufstellung dieses Spiels laden
  speichern(); dbR();
  toastZ('✅ Spiel zugewiesen: ' + (pg.unsereSeite === 'heim' ? 'Heim' : 'Auswärts'), 'ok');
}

function matchPlanZeileHtml() {
  const pg = S.spielstand && S.spielstand.planId ? planSpiel(S.spielstand.planId) : null;
  const text = pg
    ? '📆 ' + h(datumAnzeige(pg.datum)) + ' · ' + (pg.unsereSeite === 'heim' ? 'Heim' : 'Auswärts') + ' · ' + h(planKurz(pg.unsereSeite === 'heim' ? pg.auswaerts : pg.heim))
    : '📆 Spiel aus Spielplan zuweisen';
  return '<button class="btn ' + (pg ? 'btn-out' : 'btn-acc') + ' btn-sm btn-full" type="button" style="margin-bottom:.625rem;justify-content:space-between" onclick="planWahlOeffnen(\'zuweisen\')">'
    + '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis">' + text + '</span><span>✏️</span></button>';
}

/* --- Planung / Aufstellung je Spiel --- */
// Arbeitsstand = S.spieler[].verfuegbarWE/spielteam + S.spielplanung + S.aufstellung.
// Er gehört zum Spiel S.planungSpielId (null = freie Planung ohne Spiel) und wird bei jedem Speichern im Spiel abgelegt.
function planungSnapshot() {
  const verf = {};
  S.spieler.forEach(s => { verf[s.id] = { v: !!s.verfuegbarWE, t: s.spielteam || null }; });
  const A = S.aufstellung || {};
  return JSON.parse(JSON.stringify({
    verf,
    spielplanung: S.spielplanung || {},
    aufstellung: { formation: A.formation || '2-3-1', lineup: A.lineup || { A: [], B: [] } }
  }));
}

function planungImSpielAblegen() {
  try {
    if (!Array.isArray(S.spieler) || !S.spielplan) return;
    const snap = planungSnapshot();
    if (S.planungSpielId) {
      const g = planSpiel(S.planungSpielId);
      if (g) g.planung = snap; else S.planungSpielId = null;
    }
    if (!S.planungSpielId) S.planungFrei = snap;
  } catch (_) {}
}

function planungAnwenden(snap) {
  const alt = S.spielplanung || {};
  const A = S.aufstellung || {};
  S.spieler.forEach(s => {
    const v = snap && snap.verf && snap.verf[s.id];
    s.verfuegbarWE = !!(v && v.v);
    s.spielteam = v ? v.t : null;
  });
  const kopie = o => JSON.parse(JSON.stringify(o));
  S.spielplanung = snap && snap.spielplanung
    ? Object.assign({ viertel: 4, dauerMin: 15, lineupA: [], lineupB: [] }, kopie(snap.spielplanung))
    : { viertel: alt.viertel || 4, dauerMin: alt.dauerMin || 15, lineupA: [], lineupB: [], gk1A: null, gk1B: null };
  S.aufstellung = {
    team: A.team || 'A', q: 0,
    formation: (snap && snap.aufstellung && snap.aufstellung.formation) || A.formation || '2-3-1',
    lineup: snap && snap.aufstellung && snap.aufstellung.lineup ? kopie(snap.aufstellung.lineup) : { A: [], B: [] }
  };
}

function planungHatLineup(snap) {
  if (!snap) return false;
  const sp = snap.spielplanung || {};
  if ((sp.lineupA && sp.lineupA.length) || (sp.lineupB && sp.lineupB.length)) return true;
  const l = (snap.aufstellung && snap.aufstellung.lineup) || {};
  return ['A', 'B'].some(t => (l[t] || []).some(r => Array.isArray(r) && r.some(Boolean)));
}

function planungSpielWaehlen(id) {
  const neu = id && planSpiel(id) ? id : null;
  if (neu === (S.planungSpielId || null)) { spielplanungR(); return; }
  planungImSpielAblegen();
  S.planungSpielId = neu;
  planungAnwenden(neu ? planSpiel(neu).planung : S.planungFrei);
  einsatzPrevQ = -1;
  speichern();
  spielplanungR();
  matchAufstellungR();
  dbR();
  toastZ(neu ? '✅ Planung für dieses Spiel geöffnet' : 'Freie Planung geöffnet', 'ok');
}

function planungOeffnen(id) {
  planungSpielWaehlen(id);
  spielUnterpunktWaehlen('planung');
}

// Auswahl oben in der Spielplanung: nächstes, übernächstes … Spiel
function planungSpielAuswahlHtml() {
  const liste = planOffen();
  const aktiv = S.planungSpielId ? planSpiel(S.planungSpielId) : null;
  if (!liste.length && !aktiv) return '';
  const opt = (g, i) => {
    const gegner = planKurz(g.unsereSeite === 'heim' ? g.auswaerts : g.heim);
    const lb = i === 0 ? 'Nächstes Spiel' : i === 1 ? 'Übernächstes Spiel' : (i + 1) + '. nächstes Spiel';
    return '<option value="' + g.id + '"' + (aktiv && aktiv.id === g.id ? ' selected' : '') + '>' + h((i >= 0 ? lb + ': ' : '') + datumAnzeige(g.datum) + ' · ' + (g.unsereSeite === 'heim' ? 'Heim' : 'Auswärts') + ' · ' + gegner) + '</option>';
  };
  let opts = '<option value=""' + (!aktiv ? ' selected' : '') + '>— freie Planung (kein bestimmtes Spiel) —</option>';
  const ids = new Set(liste.map(g => g.id));
  if (aktiv && !ids.has(aktiv.id)) opts += opt(aktiv, -1);
  opts += liste.map((g, i) => opt(g, i)).join('');
  return '<div class="fg" style="margin-bottom:.75rem"><label for="planung-spiel">📆 Planung für</label>'
    + '<select id="planung-spiel" onchange="planungSpielWaehlen(this.value)">' + opts + '</select>'
    + (aktiv ? '<div style="font-size:.75rem;color:var(--mut);margin-top:.25rem">' + planTeamsText(aktiv) + (aktiv.ort ? ' · 📍 ' + h(aktiv.ort) : '') + '</div>' : '')
    + '</div>';
}

// Passt die geöffnete Planung zum im Match zugewiesenen Spiel?
function planungPasstZumMatch() {
  const pid = S.spielstand && S.spielstand.planId;
  return !(pid && planSpiel(pid) && pid !== S.planungSpielId);
}

/* --- Anzeige: Dashboard (offene Spiele) und Spiel → Spielplan --- */
let dbAlleOffen = false;
function dbOffenUmschalten() { dbAlleOffen = !dbAlleOffen; offeneSpieleR(); }

function offeneSpieleR() {
  const el = document.getElementById('db-offen');
  if (!el) return;
  const offen = planOffen();
  if (!offen.length) { el.innerHTML = ''; return; }
  const LIMIT = 3;
  el.innerHTML = '<div class="ber-ti" style="margin-bottom:.375rem">📆 Offene Spiele (' + offen.length + ')</div>'
    + '<div class="db-match-list">' + offen.slice(0, dbAlleOffen ? offen.length : LIMIT).map(g =>
      '<div class="db-match-row"><div class="db-match-head"><span class="db-match-side">' + (g.unsereSeite === 'heim' ? 'Heim' : 'Auswärts') + '</span>'
      + '<span class="db-match-date">' + h(planDatumText(g)) + '</span></div>'
      + '<div class="db-match-body"><span class="db-match-teams">' + planTeamsText(g) + '</span></div>' + planOrtHtml(g) + '</div>').join('') + '</div>'
    + (offen.length > LIMIT ? '<button class="btn btn-out btn-sm btn-full" type="button" style="margin-bottom:.9rem" onclick="dbOffenUmschalten()">' + (dbAlleOffen ? 'Weniger anzeigen' : 'Alle ' + offen.length + ' offenen Spiele anzeigen') + '</button>' : '');
}

function spielplanR() {
  const el = document.getElementById('spielplan-content');
  if (!el) return;
  const liste = planNachDatum(spielplanListe());
  const kopf = '<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem">'
    + '<button class="btn btn-prim btn-sm" type="button" onclick="spielplanImportOeffnen()">📥 Importieren</button>'
    + '<button class="btn btn-out btn-sm" type="button" onclick="planSpielBearbeiten()">＋ Spiel</button>'
    + '<a class="btn btn-out btn-sm" href="' + h(spielplanUrl()) + '" target="_blank" rel="noopener">📄 PDF</a></div>'
    + (S.spielplan && S.spielplan.stand ? '<div style="font-size:.6875rem;color:var(--mut);margin:-.375rem 0 .625rem">Stand ' + h(S.spielplan.stand) + '</div>' : '');
  if (!liste.length) { el.innerHTML = kopf + '<p style="color:var(--mut);font-size:.8125rem">Noch kein Spielplan. Importiere ihn aus dem bfv.de-PDF.</p>'; return; }
  el.innerHTML = kopf + '<div class="db-match-list">' + liste.map(g => {
    const e = planEintrag(g.id);
    const klasse = e ? dashboardErgebnisKlasse(e) : '';
    const rechts = e ? '✅ ' + e.heim + ' - ' + e.auswaerts : (g.ergebnis ? g.ergebnis.heim + ' - ' + g.ergebnis.auswaerts : 'offen');
    return '<div class="db-match-row' + klasse + '"><div class="db-match-head"><span class="db-match-side">' + (g.unsereSeite === 'heim' ? 'Heim' : 'Auswärts') + '</span>'
      + '<div class="db-match-head-right"><span class="db-match-date">' + h(planDatumText(g)) + '</span>'
      + '<button class="ib edit" type="button" onclick="planungOeffnen(\'' + g.id + '\')" aria-label="Aufstellung planen" style="width:28px;height:28px;font-size:.8rem">🧩</button>'
      + '<button class="ib edit" type="button" onclick="planSpielBearbeiten(\'' + g.id + '\')" aria-label="Spiel bearbeiten" style="width:28px;height:28px;font-size:.8rem">✏️</button>'
      + '<button class="ib" type="button" onclick="planSpielLoeschen(\'' + g.id + '\')" aria-label="Spiel löschen" style="width:28px;height:28px;font-size:.8rem">🗑️</button></div></div>'
      + '<div class="db-match-body"><span class="db-match-teams">' + planTeamsText(g) + '</span><span class="db-match-score" style="font-size:.9rem">' + h(rechts) + '</span></div>' + planOrtHtml(g)
      + (planungHatLineup(g.id === S.planungSpielId ? planungSnapshot() : g.planung) ? '<div style="font-size:.6875rem;color:var(--ok);margin-top:.25rem">🧩 Aufstellung geplant</div>' : '') + '</div>';
  }).join('') + '</div>';
}

/* ===== ALLES RENDERN ===== */
function allesR() {
  spielplanR(); dbR(); spielerR(); trainerR(); trainingR(); planR(); spielplanungR(); gegnerR(); torschuetzenR(); matchAufstellungR(); tonButtonR();
}

  );

  });

  });

/* ===== UPDATE-HINWEIS ===== */

function updateHinweisZeigen(neu) {
  if (document.getElementById('update-bar')) return;
  const bar = document.createElement('div');
  bar.id = 'update-bar';
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);z-index:150;display:flex;justify-content:center;pointer-events:none';
  bar.innerHTML = '<button type="button" class="btn btn-acc" style="pointer-events:auto;box-shadow:var(--shl)" onclick="location.reload()">🔄 Neue Version ' + h(neu) + ' – tippen zum Laden</button>';
  document.body.appendChild(bar);
}

// Fragt (höchstens alle 30 Minuten, nur mit Internet) die aktuelle Version der Seite ab
async function updatePruefen(erzwingen) {
  if (!location.protocol.startsWith('http') || navigator.onLine === false) return;
  try {
    const letzte = Number(localStorage.getItem('ebe_update_pruefung') || 0);
    if (!erzwingen && Date.now() - letzte < 30 * 60 * 1000) return;
    localStorage.setItem('ebe_update_pruefung', String(Date.now()));
    const res = await fetch(location.pathname, { cache: 'no-store' });
    if (!res.ok) return;
    const m = (await res.text()).match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) updateHinweisZeigen(m[1]);
  } catch (_) {}
}

/* ===== OFFLINE-MODUS (Service Worker) ===== */
// Funktioniert nur über https (z. B. GitHub Pages); beim Öffnen als lokale Datei wird er übersprungen
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    setTimeout(updatePruefen, 3000);
  });
}
// Browser bitten, die Daten nicht von selbst zu löschen
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(_) {}

/* ===== START ===== */
document.addEventListener('DOMContentLoaded', () => {
  laden();
  timerWiederherstellen();
  allesR();
  initEvents();
});
</script>
